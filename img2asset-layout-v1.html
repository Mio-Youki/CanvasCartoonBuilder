<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Loom · UI 重构 v1（功能副本）</title>
<style>
  :root { --bg:#0b1026; --panel:#141b3d; --ink:#e8ecff; --dim:#8b93c7; --yellow:#ffd23f; --cyan:#4dc3ff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: monospace; margin: 0; padding: 14px; }
  h1 { color: var(--yellow); font-size: 13px; letter-spacing: 2px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 10px; margin-bottom: 12px; }
  .cols { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; min-height: calc(100vh - 96px); }
  .panel { background: var(--panel); border: 3px solid #0a0e22; padding: 12px; }
  .p-import { width: 300px; }
  .p-stage { flex: 1; min-width: 420px; }
  .p-props { width: 320px; display: flex; flex-direction: column; }
  label { display: block; font-size: 9px; color: var(--dim); margin: 9px 0 3px; letter-spacing: 1px; }
  input[type=text], input[type=number], select {
    width: 100%; background: #0d1330; color: var(--ink); border: 2px solid var(--dim);
    padding: 6px; font-family: inherit; font-size: 11px; outline: none;
  }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 70px; }
  .drop {
    border: 3px dashed var(--dim); padding: 18px; text-align: center; font-size: 10px;
    color: var(--dim); cursor: pointer; margin-top: 8px;
  }
  .drop.over { border-color: var(--yellow); color: var(--yellow); }
  button {
    background: #1a2350; color: var(--ink); border: 3px solid #0a0e22; font-family: inherit;
    font-size: 10px; padding: 8px 10px; cursor: pointer; margin-top: 8px; min-height: 36px;
  }
  button.primary { background: var(--yellow); color: #0b1026; border-color: #8a6d00; }
  button:active { transform: translateY(2px); }
  .lib { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .lib-item { width: 86px; text-align: center; cursor: pointer; border: 3px solid var(--dim); padding: 4px; background: #0d1330; }
  .lib-item.active { border-color: var(--yellow); }
  .lib-item canvas { width: 100%; image-rendering: pixelated; display: block; }
  .lib-item .nm { font-size: 8px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas.stage { image-rendering: pixelated; background: transparent; display: block; }
  .stage-wrap { position: relative; margin-top: 8px; border: 3px solid var(--dim); background: #05070f; width: 100%; height: 218px; overflow: hidden; }
  /* 显示框高度由 JS 按 cfg.w:cfg.h 比例计算（上限= 视口高× 2/3，防高比例 js 吞掉时间轴）。
     双画布绝对定体+ JS 显式尺寸（ fit × 缩放），像素化缩放；超出部分被容器裁剪*/
  .stage-wrap canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  .stage-wrap canvas.editor-overlay { image-rendering: auto !important; pointer-events: none; z-index: 3; }
  #home-scene { display: none; } /* 初始不载入场景：载入实际 js 后才显示 */
  #stage { position: absolute; }
  .timeline { width: 100%; height: 20px; display: block; margin-top: 6px; border: 2px solid var(--dim); background: #05070f; cursor: crosshair; }
  .timeline-labels { position: relative; height: 14px; margin-top: 3px; overflow: hidden; font-size: 8px; line-height: 14px; color: var(--dim); user-select: none; }
  .timeline-labels.top { margin-top: 6px; color: var(--ink); }
  .timeline-label { position: absolute; max-width: 28%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transform: translateX(-50%); pointer-events: none; }
  .timeline-label.tick { transform: translateX(-50%); color: var(--dim); }
  .timeline-label.tick.edge-left { transform: none; }
  .timeline-label.tick.edge-right { transform: translateX(-100%); }
  .tl-bar { margin-top: 6px; padding: 6px 8px; border: 2px solid var(--dim); background: #0b1120; }
  .scene-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 18px; align-items: center; }
  .scene-chip { margin: 0; padding: 2px 6px; min-height: 18px; font-size: 8px; border-width: 2px; }
  .scene-chip.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .scene-chip.add { border-style: dashed; border-color: var(--dim); color: var(--dim); }
  .scene-chip .x { color: #ff5f7d; margin-left: 3px; }
  .hb.sbtn { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; line-height: 1; color: var(--dim); background: #1a2350; }
  .hb.sbtn.on { background: var(--yellow); color: #0b1026; }
  .show-pop { z-index: 99; background: #101736; border: 2px solid var(--yellow); padding: 6px; min-width: 170px; box-shadow: 4px 4px 0 #000; }
  .wizard-mask { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(3,6,18,.78); padding: 16px; }
  .wizard { width: min(620px, 100%); background: #141b3d; border: 3px solid var(--yellow); box-shadow: 7px 7px 0 #000; padding: 14px; }
  .wizard h2 { margin: 0 0 8px; color: var(--yellow); font-size: 13px; }
  .wizard .preview { min-height: 148px; display: grid; place-items: center; margin: 10px 0; border: 2px solid var(--dim); background: #05070f; overflow: hidden; }
  .wizard .preview canvas { max-width: 100%; max-height: 250px; image-rendering: pixelated; }
  .wizard .choice { margin: 0; min-height: 28px; padding: 4px 7px; font-size: 9px; }
  .export-mode { display: block; width: 100%; text-align: left; margin: 4px 0; min-height: 30px; padding: 5px 7px; border: 2px solid #2c3560; background: #101736; color: var(--ink); cursor: pointer; font-size: 9px; }
  .export-mode:has(input:checked) { border-color: var(--yellow); background: #33270f; }
  .export-mode small { color: var(--dim); display: block; margin-left: 17px; font-size: 8px; }
  .export-range { display: flex; align-items: center; gap: 6px; margin: 3px 0; padding: 3px 6px; border: 1px solid #2c3560; background: #101736; font-size: 9px; }
  .export-range input { margin: 0; }
  .export-count { color: var(--cyan); font-size: 9px; min-height: 14px; margin-top: 7px; }
  .show-pop-title { font-size: 8px; color: var(--dim); margin-bottom: 4px; }
  .show-row-wrap { margin-bottom: 5px; }
  .show-row { display: flex; align-items: center; gap: 6px; width: 100%; margin: 2px 0; padding: 3px 6px; font-size: 9px; min-height: 20px; border-width: 2px; background: #1a2350; color: var(--dim); text-align: left; }
  .show-row.on { border-color: #2fbf6a; color: var(--ink); background: #14301f; }
  .show-row .idx { color: var(--yellow); min-width: 14px; }
  .show-row .nm { flex: 1; }
  .show-row .cnt { font-size: 8px; color: var(--dim); }
  .win-wrap { margin: 2px 0 2px 20px; }
  .win-bar { position: relative; height: 12px; background: #0a0e22; border: 1px solid var(--dim); cursor: copy; user-select: none; }
  .win-seg { position: absolute; top: 0; bottom: 0; background: #2fbf6a; opacity: .85; cursor: grab; box-shadow: inset 0 0 0 1px #1a5c36; }
  .win-seg i { position: absolute; top: 0; bottom: 0; width: 3px; background: #0b1026; cursor: ew-resize; }
  .win-seg .win-hl { left: 0; }
  .win-seg .win-hr { right: 0; }
  .win-info { display: none; }
  .sf-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .sf-row .small { padding: 4px 6px; font-size: 9px; margin: 0; min-height: 24px; white-space: nowrap; }
  .sf-sep { width: 1px; height: 18px; background: var(--dim); opacity: .4; flex: none; }
  .sf-l { font-size: 7px; color: var(--dim); margin: 0; white-space: nowrap; }
  .sf-l.nm { color: var(--cyan); }
  .sf-n { width: 38px; padding: 3px 4px; font-size: 10px; }
  .sf-c { width: 28px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .sf-play { margin-left: auto; flex: none; }
  .draw-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; padding: 4px 0; border-bottom: 1px dashed #1a2350; }
  .draw-row .small { margin: 0; padding: 3px 7px; min-height: 22px; font-size: 8px; }
  .draw-row .dbtn.active { background: var(--yellow); color: #0b1026; border-color: #8a6d00; }
  .draw-row select.sf-n { width: 86px; padding: 2px 4px; font-size: 9px; }
  .draw-style { display: inline-flex; align-items: center; gap: 3px; padding: 2px 5px; min-height: 28px; border: 1px solid #2c3560; background: #101736; }
  .draw-style[hidden] { display: none; }
  .draw-style .sf-l { margin: 0; }
  .draw-style input[type=checkbox] { margin: 0; }
  .draw-style .sf-n { width: 42px; height: 22px; }
  .hint-inline { font-size: 8px; color: var(--dim); }
  .hint { font-size: 9px; color: var(--dim); line-height: 1.8; margin-top: 8px; }
  .hint b { color: var(--yellow); }
  .meta { font-size: 9px; color: var(--cyan); min-height: 12px; margin-top: 6px; }
  .cf-group { font-size: 9px; color: var(--yellow); letter-spacing: 1px; margin: 10px 0 2px; border-bottom: 1px dashed #2c3560; padding-bottom: 2px; }
  .props-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .props-head label { margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props-head .small { margin: 0; min-height: 26px; padding: 4px 10px; }
  .props-tabs { display: flex; gap: 3px; flex: none; }
  .props-tabs .small { padding: 4px 6px; font-size: 8px; }
  .props-tabs .small.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .props-tools, .props-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .props-tools { margin: 2px 0 5px; }
  .props-tools .small, .props-actions .small { margin: 0; min-height: 25px; padding: 4px 8px; }
  .props-actions { padding-top: 2px; }
  .subhead { color: var(--yellow); font-size: 9px; letter-spacing: 1px; margin: 10px 0 3px; border-top: 1px dashed #2c3560; padding-top: 7px; }
  #cfgform { flex: 1 1 0; height: 0; min-height: 100px; max-height: calc(100vh - 210px); overflow-y: auto; border: 2px solid #0a0e22; padding: 4px; margin-bottom: 6px; background: #0d1330; scrollbar-width: thin; scrollbar-color: #3a4678 #0a0e22; }
  #cfgform::-webkit-scrollbar { width: 8px; }
  #cfgform::-webkit-scrollbar-track { background: #0a0e22; }
  #cfgform::-webkit-scrollbar-thumb { background: #3a4678; border-radius: 4px; }
  #cfgform::-webkit-scrollbar-thumb:hover { background: #4a5890; }
  .layer-card { border: 2px solid #1a2350; background: #101736; margin: 3px 0; user-select: none; -webkit-user-select: none; } /* 整卡禁文本选择：拖拽走 HTML5 drag，不触发浏览器「拖拽搜索。*/
  /* 表单控件不继承父线 user-select（ UA 默认保持可选）——必须直接设 none：否则从卡片内输入框拖起仍会触发 Edge「拖拽搜索」；输入仍可点击聚焦/键入（鼠标框选文本受限，可用键盘 Shift+方向键） */
  .layer-card input, .layer-card textarea, .layer-card select,
  .cf-box input, .cf-box textarea, .cf-box select,
  .layer-card button, .cf-box button { user-select: none; -webkit-user-select: none; }
  .layer-card.sel { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow); } /* 选中强调：黄色描线*/
  .layer-card.multi { border-color: #b985ff; box-shadow: inset 3px 0 0 #b985ff; }
  .group-card { border-color: #6b479a; background: #171337; }
  .group-card.sel { border-color: #b985ff; box-shadow: 0 0 0 1px #b985ff; }
  .group-card .layer-name { color: #d7b8ff; }
  .group-badge { color: #d7b8ff; font-size: 8px; }
  .layer-card.global { border-color: var(--dim); }
  .layer-card.img { border-color: #2a3a66; }
  .layer-card.drag { opacity: .5; border-color: var(--yellow); }
  .layer-card.insert-before { box-shadow: 0 -3px 0 var(--yellow); }
  .layer-card.insert-after { box-shadow: 0 3px 0 var(--yellow); }
  .layer-card.hid { opacity: .45; }
  .layer-head { display: flex; align-items: center; gap: 5px; padding: 4px 5px; cursor: pointer; font-size: 9px; user-select: none; -webkit-user-select: none; }
  .layer-head:hover { background: #16204a; }
  .lgrip { color: var(--dim); cursor: grab; }
  .layer-z { font-size: 8px; color: var(--yellow); min-width: 22px; }
  .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .layer-card.img .layer-name { color: var(--cyan); }
  .lcarr { color: var(--yellow); font-size: 8px; width: 8px; }
  .layer-head .hb { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; line-height: 1; }
  .layer-head .hb.hid { background: #33270f; color: var(--dim); }
  .layer-head .hb.on { background: #33270f; color: var(--yellow); }
  .cf-box { border: 1px dashed #2c3560; padding: 3px 4px; margin: 3px 0; background: #0b1128; }
  .cf-box[draggable=true] { cursor: grab; }
  .cf-box.drag { opacity: .45; border-color: var(--yellow); }
  .cf-box.insert-before { box-shadow: 0 -3px 0 var(--yellow); }
  .cf-box.insert-after { box-shadow: 0 3px 0 var(--yellow); }
  .part-head { display: flex; align-items: center; gap: 5px; min-height: 20px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .part-head .part-title { flex: 1; font-size: 8px; color: var(--ink); }
  .part-head .lgrip { font-size: 10px; }
  .part-head .hb { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; }
  .part-style { display: flex; align-items: center; gap: 5px; min-height: 24px; padding-top: 3px; font-size: 8px; color: var(--dim); }
  .part-style label { margin: 0; font-size: 8px; }
  .part-style input[type=color] { width: 23px; height: 19px; padding: 0; border: 1px solid var(--dim); }
  .part-style input[type=number] { width: 38px; padding: 2px 3px; font-size: 9px; }
  .part-extra { border-top: 1px dashed #2c3560; margin-top: 3px; padding-top: 2px; }
  .cf-box { user-select: none; -webkit-user-select: none; }
  .part-extra .part-legacy-style { display: none; }
  .layer-body { border-top: 1px dashed #2c3560; padding: 4px 6px 6px; }
  .cf-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .cf-row-inline { display: flex; align-items: center; gap: 6px; flex: 1; }
  .side-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .side-tab { flex: 1; margin: 0; padding: 4px 0; min-height: 24px; font-size: 10px; border-width: 2px; }
  .side-tab.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .cf-box.sel { border-color: #4dc3ff; }
  .cf-row label { flex: 1; margin: 0; font-size: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-row input[type=number] { width: 76px; }
  .cf-row input[type=text] { width: 110px; }
  .cf-row input[type=color] { width: 44px; height: 26px; padding: 0; border: 2px solid var(--dim); }
  .color-field { display:flex; align-items:center; gap:6px; min-width:0; }
  .color-swatch { width:28px; height:22px; min-height:22px; padding:0; margin:0; border:1px solid var(--line); box-shadow:inset 0 0 0 1px #000; }
  .color-alpha { color:var(--dim); font-size:10px; min-width:32px; }
  .color-pop { position:fixed; z-index:1000; width:228px; padding:10px; border:1px solid #4b5260; background:#20242c; box-shadow:0 10px 28px #000b; color:var(--ink); }
  .color-pop[hidden] { display:none; }
  .color-pop-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:11px; }
  .color-pop-close { margin:0; min-height:20px; padding:1px 6px; border:0; background:transparent; color:var(--dim); }
  .color-sv { position:relative; height:122px; cursor:crosshair; background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(0,100%,50%)); }
  .color-sv-dot { position:absolute; width:12px; height:12px; border:1px solid #fff; border-radius:50%; box-shadow:0 0 0 1px #000; transform:translate(-50%,-50%); pointer-events:none; }
  .color-slider-row { display:grid; grid-template-columns:18px 1fr; align-items:center; gap:6px; margin-top:8px; }
  .color-slider-row input[type=range] { margin:0; width:100%; height:10px; accent-color:var(--yellow); }
  .color-eyedropper { width:18px; height:18px; min-height:18px; padding:0; margin:0; border:0; background:transparent; color:var(--dim); font-size:12px; line-height:1; }
  .color-eyedropper:hover { color:var(--ink); }
  .color-pop-values { display:grid; grid-template-columns:1fr 72px; gap:6px; margin-top:8px; }
  .color-pop-values input { min-width:0; width:100%; padding:4px 6px; font-size:10px; background:#151820; color:var(--ink); border:1px solid var(--line); }
  .paint-row { display:flex; align-items:center; gap:5px; min-width:0; justify-content:flex-end; }
  .paint-row input[type=checkbox] { width:14px; margin:0; accent-color:var(--yellow); }
  .paint-row input[type=number] { width:42px; height:22px; padding:2px 4px; }
  .paint-row .color-field { flex:1; justify-content:flex-end; }
  .texture-preview { width:44px; height:22px; min-height:22px; padding:0; margin:0; border:1px solid var(--line); background:#151820; overflow:hidden; }
  .texture-preview canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }
  .texture-pop { position:fixed; z-index:1000; width:250px; padding:10px; border:1px solid #4b5260; background:#20242c; box-shadow:0 10px 28px #000b; }
  .texture-pop[hidden] { display:none; }
  .texture-pop-head { display:flex; align-items:center; justify-content:space-between; font-size:11px; margin-bottom:8px; }
  .texture-pop-preview { width:100%; height:72px; display:block; background:#11151c; border:1px solid var(--line); image-rendering:pixelated; margin-bottom:8px; }
  .texture-pop-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .texture-pop-grid label { margin:0; font-size:9px; color:var(--dim); }
  .texture-pop-grid input, .texture-pop-grid select { width:100%; height:23px; margin-top:3px; padding:2px 4px; background:#151820; color:var(--ink); border:1px solid var(--line); font:inherit; }
  .cf-row input[type=checkbox] { width: auto; }
  .cf-arr { display: flex; gap: 3px; flex-wrap: wrap; }
  .cf-arr input[type=color] { width: 22px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .cf-ro { font-size: 8px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ================================================================
     UI RECONSTRUCTION V1 · 仅布局与视图 Shell
     设计合同： docs/design/UI_RECONSTRUCTION_V1.md
     本副本保留原本 id、事件和 Scene 格式；结构树 / Inspector 的数据接线后续完成。
     ================================================================ */
  :root {
    --shell:#111319; --surface:#1a1d24; --surface-hi:#222630; --surface-low:#151820;
    --line:#303642; --line-soft:#252a34; --ink:#f1f3f6; --dim:#9aa3b2;
    --yellow:#f4c84b; --cyan:#55c7e9; --green:#5dc58a; --magenta:#bc92ee; --red:#eb6c73;
  }
  body { background:var(--shell); padding:0; min-width:1080px; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; font-size:13px; }
  * { scrollbar-width:thin; scrollbar-color:#555c68 transparent; }
  *::-webkit-scrollbar { width:5px; height:5px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:#555c68; border-radius:0; }
  *::-webkit-scrollbar-thumb:hover { background:#7a8493; }
  h1 { display:none; }
  .sub { display:none; }
  .workbench-header { height:42px; display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid var(--line); background:#171a21; }
  .workbench-brand { color:var(--yellow); font-size:13px; letter-spacing:.12em; }
  .workbench-name { color:var(--ink); font-size:12px; padding:6px 10px; border:1px solid var(--line); background:#20242d; min-width:170px; }
  .workbench-note { color:var(--dim); font-size:10px; }
  .workbench-note b { color:var(--cyan); font-weight:400; }
  .workbench-tools { height:46px; margin-right:324px; display:flex; align-items:center; gap:7px; padding:0 10px; border-bottom:1px solid var(--line); background:#20242b; }
  .workbench-tools button { min-height:30px; padding:5px 9px; border-color:transparent; background:transparent; font-size:12px; }
  .workbench-tools button:hover { border-color:var(--line); background:#252a34; }
  .scene-file-actions { align-self:stretch; width:250px; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; padding:7px 0; border-right:1px solid var(--line); }
  .scene-file-actions button { min-width:0; padding:4px 3px; font-size:11px; }
  .tool-slots { display:flex; align-items:center; gap:2px; }
  .tool-slots button { min-width:30px; font-size:0; }
  .tool-slots button::first-letter { font-size:12px; }
  .toolbar-output-actions { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .toolbar-output-actions button { font-size:11px; }
  .workbench-tools .tool-sep { width:1px; height:18px; margin:0 4px; background:var(--line); }

<h1>像素动态场景工作台 · PIXEL LOOM</h1>
<div class="sub">任意图片 ↖像素像→拖拽装配（滚劀闪烁/脉动）→ 打开/保存场景 js（页面内直接改写配置，无需复制粘贴）。开发工具，不随游戏发布。</div>

<div class="cols">
  <!-- 左：场景结构 + 成品素材场-->
  <div class="panel p-import">
    <section class="structure-pane" aria-label="场景结构">
      <div class="structure-head"><span>场景结构</span></div>
      <div id="structure-tree"><div class="struct-empty">正在读取场景结构…</div></div>
    </section>
    <div id="asset-splitter" class="asset-splitter" title="拖动调整场景结构与素材库高度"></div>
    <section id="asset-pane" class="asset-pane" aria-label="素材库">
      <div id="asset-head" class="asset-head"><span class="asset-title">素材</span><button id="btn-import" title="导入素材">+</button></div>

        <div id="lib" class="lib"></div>
        <div class="meta" id="m-import"></div>

      <label>导入素材（任意图片，非8bit 亦可。</label>

      <input id="file" type="file" accept="image/*" multiple hidden>
      <label><input type="checkbox" id="style-on" checked> 样式化（关= 原样 1:1 显示。</label>
      <label>采样数（原图 ÷ N；像素化 = 缩小 N 倍采样，整数。</label>
      <div class="row">
        <input id="divisor" type="number" min="1" step="1" value="2" style="flex:1">
        <select id="alpha-mode" title="边缘透明像素：保留默认软边；消限 alpha&lt;128 变透明 + alpha&gt;=128 拉满（一步到位只剩透明/不透明）；增强=全部半透明拉满">
          <option value="keep">边缘：保留</option>
          <option value="remove">边缘：消除</option>
          <option value="boost">边缘：增强</option>
        </select>
      </div>
      <label>减色色板（映射到有限色板最近色。</label>
      <select id="palette">
        <option value="">无（保持原色。</option>
        <option value="pico8">PICO-8 · 32 色（色彩丰富。</option>

// 提取 js 中的对象字面量（平衡括号，支持嵌套； JS 对象字面量用求值解析）
// 返回 {obj, start, end} 含{err}（解析失败）含 null（未找到声明。
function extractObj(text, name) {
  const re = new RegExp('(?:const|let|var)\\s+' + name + '\\s*=\\s*(\\{)', 'm');
  const m = re.exec(text);
  if (!m) return null;
  let i = m.index + m[0].indexOf('{');
  const start = i;
  let depth = 0;
  for (; i < text.length; i++) {
    if (text[i] === '{') depth++;
    else if (text[i] === '}') { depth--; if (depth === 0) { i++; break; } }
  }
  const body = text.slice(start, i);
  try {
    const obj = new Function('return (' + body + ')')();
    return { obj, start, end: i };
  } catch (e) {
    return { err: '解析 ' + name + ' 失败：' + e.message };
  }
}

/* ---------------- 通用场景可编辑性诊断（详见 SCENE_SPEC.md，---------------- */
function checkGenericEditability(cfg, isGeneric) {
  const warns = [];
  if (!isGeneric) return warns;
  const builtins = new Set(['train-beam']);
  const n = cfg.scenes && cfg.scenes.length ? cfg.scenes.length : null;
  const warn = s => { if (!warns.includes(s)) warns.push(s); };
  if (cfg.format && cfg.format !== 'canvas-cartoon-scene') warn('format 应为 "canvas-cartoon-scene"；当前工具只把该格式视为通用场景工程');
  if (!Number.isFinite(cfg.w) || cfg.w <= 0 || !Number.isFinite(cfg.h) || cfg.h <= 0) warn('画布 w/h 必须是大于 0 的数值');
  if (!Number.isFinite(cfg.loop) || cfg.loop <= 0) warn('loop 必须是大于 0 的秒数');
  if (cfg.sceneBorders && (!n || cfg.sceneBorders.length !== n - 1 || cfg.sceneBorders.some((v, i, a) => !Number.isFinite(v) || v <= 0 || v >= cfg.loop || (i && v <= a[i - 1])))) warn('sceneBorders 必须严格递增、位于 0~loop 内，且长度为 scenes 数减一');
  const imageIds = new Set();
  (cfg.images || []).forEach((img, i) => {
    const at = 'images[' + i + ']';
    if (!img || typeof img !== 'object') return warn(at + ' 必须是对象');
    if (img.id) { if (imageIds.has(img.id)) warn('images.id 重复：' + img.id); imageIds.add(img.id); }
    const vectorOnly = img.parts && img.parts.length;
    if (!vectorOnly && (!img.id || !img.src || !Number.isFinite(img.x) || !Number.isFinite(img.y) || !Number.isFinite(img.w) || !Number.isFinite(img.h))) warn(at + ' 图片元素需要 id、 src、 x、 y、 w、 h；纯 parts 元素除外');
    if (img.src && typeof img.src === 'string' && !img.src.startsWith('data:')) warn(at + '.src 不是 data: 快照；浏览器版保存后可能无法独立携带该素材');
  });
  if (cfg.groups != null) {
    if (!Array.isArray(cfg.groups)) warn('groups 必须是父级组数组');
    else {
      const known = new Set((cfg.images || []).filter(e => e && e.id && e.role !== 'background' && e.role !== 'mask').map(e => e.id));
      const seen = new Set();
      cfg.groups.forEach((g, i) => {
        const at = 'groups[' + i + ']';
        if (!g || typeof g !== 'object' || !g.id || !Array.isArray(g.memberIds) || g.memberIds.length < 2) { warn(at + ' 需要 id 与至少两个 memberIds'); return; }
        if (seen.has(g.id)) warn('groups.id 重复：' + g.id); seen.add(g.id);
        g.memberIds.forEach(id => { if (!known.has(id)) warn(at + '.memberIds 包含不可编辑或不存在的元素：' + id); });
      });
    }
  }
  const reserved = new Set(['format', 'formatVersion', 'kind', 'name', 'meta', 'w', 'h', 'loop', 'bg', 'transparent', 'scenes', 'sceneBorders', 'images', 'fx', 'groups', 'timeline']);
  const validateParts = (key, parts) => (Array.isArray(parts) ? parts : []).forEach((p, i) => {
    const at = key + '.parts[' + i + ']';
    if (!p || !['rect', 'line', 'ellipse', 'poly'].includes(p.type)) return warn(at + '.type 必须为 rect/line/ellipse/poly');
    if ('keyframes' in p) warn(at + '.keyframes 尚未实现，不能作为当前 Agent 输出');
    if ('color' in p || typeof p.fill === 'boolean' || 'width' in p) warn(at + ' 使用旧式 color/fill:boolean/width；新文件应使用 fill/stroke/strokeWidth');
    if (p.type === 'poly') { if (!Array.isArray(p.points) || p.points.length < 3) warn(at + '.points 至少需要 3 个顶点'); }
    else if (p.type === 'line') { if (![p.x, p.y, p.x2, p.y2].every(Number.isFinite)) warn(at + ' 的 x/y/x2/y2 必须为数值'); }
    else if (![p.x, p.y, p.w, p.h].every(Number.isFinite) || p.w <= 0 || p.h <= 0) warn(at + ' 的 x/y/w/h 必须为有效数值且 w/h > 0');
  });
  const validateMask = (key, mask) => {
    if (!mask) return;
    if (!['rect', 'ellipse', 'poly', 'alpha', 'element'].includes(mask.type)) return warn(key + '.mask.type 必须为 rect / ellipse / poly / alpha / element');
    if ((mask.type === 'rect' || mask.type === 'ellipse' || mask.type === 'alpha') && (![mask.x, mask.y, mask.w, mask.h].every(Number.isFinite) || mask.w <= 0 || mask.h <= 0)) warn(key + '.mask 的 x/y/w/h 必须为有效数值且 w/h > 0');
    if (mask.type === 'poly' && (!Array.isArray(mask.points) || mask.points.length < 3 || mask.points.some(p => !Array.isArray(p) || p.length < 2 || !Number.isFinite(p[0]) || !Number.isFinite(p[1])))) warn(key + '.mask.points 至少需要 3 个有效 [x,y] 顶点');
    if (mask.type === 'alpha' && !imageIds.has(mask.imageId)) warn(key + '.mask.imageId 必须指向 images[] 内的图片或蒙版素材');
    if (mask.type === 'element') {
      const targets=new Set();
      (cfg.images||[]).forEach(x=>x&&x.id&&targets.add(x.id));
      (cfg.groups||[]).forEach(x=>x&&x.id&&targets.add(x.id));
      Object.entries(cfg).forEach(([name,x])=>{if(x&&typeof x==='object'&&!Array.isArray(x)&&!reserved.has(name)&&x.id)targets.add(x.id);});
      if(!mask.targetId || !targets.has(mask.targetId)) warn(key+'.mask.targetId 必须指向场景中的稳定元素或组 id');
    }
  };
  for (const [key, el] of Object.entries(cfg)) {
    if (!el || typeof el !== 'object' || Array.isArray(el) || reserved.has(key)) continue;
    if (!el.id || typeof el.id !== 'string') warn(key + ' 缺少稳定 id；通用程序元素必须提供 id，供 FX 绑定与后续 Agent 精准定位');
    if ('keyframes' in el) warn(key + '.keyframes 尚未实现，不能作为当前 Agent 输出');
    if (el.kind === 'builtin' && !builtins.has(el.builtin)) warn(key + '.builtin 未注册；通用 Runtime 不会执行未知内建元素');
    else if (!el.parts && !el.particle && el.kind !== 'builtin') warn(key + ' 没有 parts、 particle 或已注册 builtin；通用 Runtime 不会绘制该顶层对象');
    validateParts(key, el.parts);
    validateMask(key, el.mask);
    if (el.particle && el.particle.source && el.particle.source.type === 'image' && !imageIds.has(el.particle.source.imageId)) warn(key + '.particle.source.imageId 未指向 images[] 内的稳定 id');
    for (const k of Object.keys(el)) {
      // 1) 按场景散键： x3 / color3 等（存在基础键）
      const m = /^(.*?)(\d+)$/.exec(k);
      if (m && m[1] && Object.prototype.hasOwnProperty.call(el, m[1])) {
        warns.push(key + '.' + k + ' 疑似按场景散键——建议合并为 ' + m[1] + ': [v0,v1,…] 按场景数组（参数轨道）');
      }
      // 2) 数值数组长度=场景数：只读结构数据
      const v = el[k];
      if (Array.isArray(v) && v.length > 1 && v.every(x => typeof x === 'number') && n && v.length !== n) {

      }
    }
  }
  (cfg.images || []).forEach((el, i) => { validateParts('images[' + i + ']', el && el.parts); validateMask('images[' + i + ']', el && el.mask); if (el && 'keyframes' in el) warn('「 images[' + i + '].keyframes」尚未实现，不能作为当前 Agent 输出'); });
  (cfg.fx && Array.isArray(cfg.fx.layers) ? cfg.fx.layers : []).forEach((layer, i) => {
    if (!layer || typeof layer !== 'object') return warn('fx.layers[' + i + '] 必须是对象');
    validateMask('fx.layers[' + i + ']', layer.mask);
    if (layer.blend && !['normal', 'screen', 'multiply', 'lighter'].includes(layer.blend)) warn('「 fx.layers[' + i + '].blend」必须为 normal / screen / multiply / lighter');
    if (layer.palette && !['none', 'pico8', 'nes', 'vga', 'gb'].includes(layer.palette)) warn('「 fx.layers[' + i + '].palette」必须为 none / pico8 / nes / vga / gb');
    if (layer.pixelDiv != null && (!Number.isFinite(+layer.pixelDiv) || +layer.pixelDiv < 1)) warn('「 fx.layers[' + i + '].pixelDiv」必须为 ≥1 的数字');
    if (layer.bind && (!layer.bind.targetId || typeof layer.bind.targetId !== 'string')) warn('「 fx.layers[' + i + '].bind.targetId」必须引用有稳定 id 的顶层元素');
    if (layer.bind && layer.bind.mode && !['anchor', 'clip'].includes(layer.bind.mode)) warn('「 fx.layers[' + i + '].bind.mode」必须为 anchor / clip');
  });
  // 3) 用了 show:{scenes} 但未声明 scenes
  if (n === null) {
    let usedShow = false;
    for (const [key, el] of Object.entries(cfg)) {
      if (el && typeof el === 'object' && !Array.isArray(el) && el.show && Array.isArray(el.show.scenes)) usedShow = true;
    }
    if (usedShow) warns.push('使用了 show:{scenes:[..]} 但未声明 scenes 段名——分段语义按 4 段兜底，建议补充 scenes:["段名",…]');
  }
  return warns;
}

  cv.addEventListener('pointermove',ev=>{const target=timelineContextTarget();if(target.kind!=='element')return hide();const r=cv.getBoundingClientRect(),frac=Math.max(0,Math.min(1,(ev.clientX-r.left)/Math.max(1,r.width))),hit=contextHit(target,frac);if(!hit||hit.idx<0)return hide();const seg=hit.arr[hit.idx],mid=(seg[0]+seg[1])/2,absolute=(hit.s0+(hit.s1-hit.s0)*mid)/hit.loop,scene=hit.scene,track=propertyTrackAt(target.el,window.HOME_SCENE,scene,hit.rel,false),all=track&&track.track.segments||[],linked=all.find(s=>Math.abs(s.f[0]-seg[0])<.002&&Math.abs(s.f[1]-seg[1])<.002),sub=s=>!!(s&&(s.type==='linear'||(s.values&&Object.keys(s.values).length))),match=q=>q&&all.find(s=>Math.abs(s.f[0]-q[0])<.002&&Math.abs(s.f[1]-q[1])<.002),side=sub(match(hit.arr[hit.idx-1]))||sub(match(hit.arr[hit.idx+1]));if(!(linked&&linked.type==='linear')&&!side)return hide();btn.style.display='block'; btn.style.left=(r.left+absolute*r.width)+'px'; btn.style.top=(r.top+r.height/2)+'px'; btn.textContent=linked&&linked.type==='linear'?'…' : '---';btn.title=linked&&linked.type==='linear'?'恢复普通时段' : '设为 Linear'; btn._hit={hit,target,linked};});
  cv.addEventListener('pointerleave',()=>setTimeout(()=>{if(!btn.matches(':hover'))hide();},80));
  btn.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();const ref=btn._hit;if(!ref)return;pushHistory();const {hit,target}=ref,showSeg=hit.arr[hit.idx],track=ensurePropertyTrack(target.el,window.HOME_SCENE,hit.scene);let seg=track.segments.find(s=>Math.abs(s.f[0]-showSeg[0])<.002&&Math.abs(s.f[1]-showSeg[1])<.002);if(!seg){seg={f:[showSeg[0],showSeg[1]],values:{}};track.segments.push(seg);track.segments.sort((a,b)=>a.f[0]-b.f[0]);}if(seg.type==='linear'){delete seg.type;delete seg.from;delete seg.to;seg.values={};}else makeDynamicLinear(seg);hide();renderTimeline();refreshStage();buildLayerList(layerCfg());});
  btn.addEventListener('pointerleave',()=>hide());
})();
function jumpScene(i) {
  // 切换编辑场景：播放头跳到该场景起点，图层坐时间轴随之更方
  const cfg = window.HOME_SCENE; if (!cfg) return;
  const [s0] = tlSceneRange(i);
  state.t = s0;
  state.lastTlScene = i;
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
  buildLayerList(layerCfg());
  renderSceneBar();
  renderStage();
  renderTimeline();
}
function addScene() {
  const cfg = window.HOME_SCENE; if (!cfg) return;
  pushHistory();
  cfg.scenes = cfg.scenes || [];
  const oldN = cfg.scenes.length;
  const v = window.prompt('新场景名，', '场景' + (oldN + 1));
  if (!v || !v.trim()) return;
  cfg.scenes.push(v.trim());
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length); // 各按场景数组沿用末位（ bg 为字符串拷贝，独立可改）
  if (showPop) { showPop.remove(); showPop = null; showFocusEl = null; } // 场景结构变化：关依[S] 弹窗（其行数/窗口按旧场景数构建，重开即按新场景数。
  buildLayerList(layerCfg());
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}
function deleteScene(i) {
  const cfg = window.HOME_SCENE; if (!cfg) return;
  pushHistory();
  const oldN = cfg.scenes.length;
  cfg.scenes.splice(i, 1);
  if (!cfg.scenes.length) cfg.scenes = ['场景'];
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length, i);
  if (showPop) { showPop.remove(); showPop = null; showFocusEl = null; } // 场景结构变化：关依[S] 弹窗
  buildLayerList(layerCfg());
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}

/* ---------------- 场景层（ home-scene.js 叠底）与画布尺寸 ---------------- */
// home-scene.js 硬编码320×118：场景层开启时画布锁定该尺寸（素材层对齐叠加），关闭时可自定义
function syncCanvasSize() {
  const cfg = window.HOME_SCENE;
  if (state.showScene && cfg) {
    state.cw = cfg.w || 320; state.ch = cfg.h || 118;
  } else {
    state.cw = Math.max(32, parseInt($('gw').value) || 320);
    state.ch = Math.max(32, parseInt($('gh').value) || 118);
  }
}
$('showscene').addEventListener('change', () => {
  state.showScene = $('showscene').checked;
  $('home-scene').style.display = state.showScene ? 'block' : 'none'; syncCanvasSize();
  renderStage();
  renderTimeline();
});

/* ---------------- 启动 ---------------- */
// 底部编排器高度仅属界面状态；固定于工作台底部，不改变场景文件。
(function initTimelineSplitter(){
  const s=$('timeline-splitter'); if(!s)return; let startY=0,startH=0;
  s.addEventListener('pointerdown',ev=>{startY=ev.clientY;startH=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--timeline-dock-h'))||132;s.setPointerCapture&&s.setPointerCapture(ev.pointerId);ev.preventDefault();});
  s.addEventListener('pointermove',ev=>{if(!startY)return;const h=Math.max(92,Math.min(280,startH+(startY-ev.clientY)));document.documentElement.style.setProperty('--timeline-dock-h',h+'px');renderTimeline();});
  s.addEventListener('pointerup',()=>{startY=0;});
})();
// 左栏高度分配属于编辑器界面状态，不写入场景；拖动使用细分隔线，保按 Rive 式低干扰层级。
(function initAssetSplitter() {
  const splitter = $('asset-splitter'), tree = $('structure-tree'), pane = $('asset-pane'), left = document.querySelector('.p-import');
  if (!splitter || !tree) return;
  let dragState = null;
  splitter.addEventListener('pointerdown', ev => {
    dragState = { y: ev.clientY, h: tree.getBoundingClientRect().height };
    splitter.classList.add('dragging'); splitter.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  splitter.addEventListener('pointermove', ev => {
    if (!dragState) return;
    // 左栏总高度固定：结构树增加的空间只会从素材容器扣除，绝不把外层撑出第二条滚动条。
    const head = pane ? pane.querySelector('.asset-head') : null;
    const max = Math.max(96, (left ? left.clientHeight : 620) - (head ? head.offsetHeight : 29) - 84);
    const h = Math.max(96, Math.min(max, Math.round(dragState.h + ev.clientY - dragState.y)));
    tree.style.setProperty('--structure-tree-h', h + 'px');
  });
  const end = ev => { if (!dragState) return; dragState = null; splitter.classList.remove('dragging'); if (splitter.hasPointerCapture(ev.pointerId)) splitter.releasePointerCapture(ev.pointerId); };
  splitter.addEventListener('pointerup', end); splitter.addEventListener('pointercancel', end);
})();
// 兜底副本：独立仓库（时../public/home-scene.js，如 CanvasCartoonBuilder）时加载本地 tools/home-scene.js
if (!window.HomeScene) {
  const fb = document.createElement('script');
  fb.src = 'home-scene.js'; fb.onload = () => {
    if (window.HomeScene) {
      window.__sceneLoadFail = false;
      HomeScene.init(); // DOMContentLoaded 已过，需手动初始像
      adoptRuntimeClock(); if (state.playing) HomeScene.start();
      if (window.HOME_SCENE) HomeScene.resize();
      if ($('m-stage').textContent.indexOf('场景层加载失败') >= 0) $('m-stage').textContent = '';
      $('home-scene').style.display = state.showScene ? 'block' : 'none'; renderStage();
      renderTimeline();
    }
  };
  document.head.appendChild(fb);
}
renderLib();
renderStyleCtl();
refreshTextFontOptions();
updateToolOptions();
createGenericScene(false);
syncGlobals();
ensureAllImages();
renderSceneBar();
renderTimeline();
syncCanvasSize();

$('home-scene').style.display = state.showScene ? 'block' : 'none'; if (window.__sceneLoadFail) $('m-stage').textContent = '⚠ 场景层加载失败：未找到 ../public/home-scene.js（可取消勾选"场景层"）';
adoptRuntimeClock();
renderStage();
state.last = performance.now();
state.raf = requestAnimationFrame(loop);
