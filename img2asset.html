<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素风小动画装配器 · Pixel Scene Builder</title>
<style>
  :root { --bg:#0b1026; --panel:#141b3d; --ink:#e8ecff; --dim:#8b93c7; --yellow:#ffd23f; --cyan:#4dc3ff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: monospace; margin: 0; padding: 14px; }
  h1 { color: var(--yellow); font-size: 13px; letter-spacing: 2px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 10px; margin-bottom: 12px; }
  .cols { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; min-height: calc(100vh - 96px); }
  .panel { background: var(--panel); border: 3px solid #0a0e22; padding: 12px; }
  .p-import { width: 300px; }
  .p-stage { flex: 1; min-width: 420px; }
  .p-props { width: 320px; display: flex; flex-direction: column; }
  label { display: block; font-size: 9px; color: var(--dim); margin: 9px 0 3px; letter-spacing: 1px; }
  input[type=text], input[type=number], select {
    width: 100%; background: #0d1330; color: var(--ink); border: 2px solid var(--dim);
    padding: 6px; font-family: inherit; font-size: 11px; outline: none;
  }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 70px; }
  .drop {
    border: 3px dashed var(--dim); padding: 18px; text-align: center; font-size: 10px;
    color: var(--dim); cursor: pointer; margin-top: 8px;
  }
  .drop.over { border-color: var(--yellow); color: var(--yellow); }
  button {
    background: #1a2350; color: var(--ink); border: 3px solid #0a0e22; font-family: inherit;
    font-size: 10px; padding: 8px 10px; cursor: pointer; margin-top: 8px; min-height: 36px;
  }
  button.primary { background: var(--yellow); color: #0b1026; border-color: #8a6d00; }
  button:active { transform: translateY(2px); }
  .lib { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .lib-item { width: 86px; text-align: center; cursor: pointer; border: 3px solid var(--dim); padding: 4px; background: #0d1330; }
  .lib-item.active { border-color: var(--yellow); }
  .lib-item canvas { width: 100%; image-rendering: pixelated; display: block; }
  .lib-item .nm { font-size: 8px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas.stage { image-rendering: pixelated; background: transparent; display: block; }
  .stage-wrap { position: relative; margin-top: 8px; border: 3px solid var(--dim); background: #05070f; width: 100%; height: 218px; overflow: hidden; }
  /* 显示框高度由 JS 按 cfg.w:cfg.h 比例计算（上限 = 视口高 × 2/3，防高比例 js 吞掉时间轴）；
     双画布绝对定位 + JS 显式尺寸（fit × 缩放），像素化缩放；超出部分被容器裁剪 */
  .stage-wrap canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  .stage-wrap canvas.editor-overlay { image-rendering: auto !important; pointer-events: none; z-index: 3; }
  #home-scene { display: none; } /* 初始不载入场景：载入实际 js 后才显示 */
  #stage { position: absolute; }
  .zoom-badge { position: absolute; top: 3px; right: 3px; z-index: 5; font-size: 8px; color: var(--yellow); background: rgba(0,0,0,.65); padding: 1px 5px; display: none; cursor: pointer; }
  .zoom-badge.on { display: block; }
  .timeline { width: 100%; height: 20px; display: block; margin-top: 6px; border: 2px solid var(--dim); background: #05070f; cursor: crosshair; }
  .timeline-labels { position: relative; height: 14px; margin-top: 3px; overflow: hidden; font-size: 8px; line-height: 14px; color: var(--dim); user-select: none; }
  .timeline-labels.top { margin-top: 6px; color: var(--ink); }
  .timeline-label { position: absolute; max-width: 28%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transform: translateX(-50%); pointer-events: none; }
  .timeline-label.tick { transform: translateX(-50%); color: var(--dim); }
  .timeline-label.tick.edge-left { transform: none; }
  .timeline-label.tick.edge-right { transform: translateX(-100%); }
  .tl-bar { margin-top: 6px; padding: 6px 8px; border: 2px solid var(--dim); background: #0b1120; }
  .scene-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 18px; align-items: center; }
  .scene-chip { margin: 0; padding: 2px 6px; min-height: 18px; font-size: 8px; border-width: 2px; }
  .scene-chip.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .scene-chip.add { border-style: dashed; border-color: var(--dim); color: var(--dim); }
  .scene-chip .x { color: #ff5f7d; margin-left: 3px; }
  .hb.sbtn { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; line-height: 1; color: var(--dim); background: #1a2350; }
  .hb.sbtn.on { background: var(--yellow); color: #0b1026; }
  .show-pop { z-index: 99; background: #101736; border: 2px solid var(--yellow); padding: 6px; min-width: 170px; box-shadow: 4px 4px 0 #000; }
  .wizard-mask { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(3,6,18,.78); padding: 16px; }
  .wizard { width: min(620px, 100%); background: #141b3d; border: 3px solid var(--yellow); box-shadow: 7px 7px 0 #000; padding: 14px; }
  .wizard h2 { margin: 0 0 8px; color: var(--yellow); font-size: 13px; }
  .wizard .preview { min-height: 148px; display: grid; place-items: center; margin: 10px 0; border: 2px solid var(--dim); background: #05070f; overflow: hidden; }
  .wizard .preview canvas { max-width: 100%; max-height: 250px; image-rendering: pixelated; }
  .wizard .choice { margin: 0; min-height: 28px; padding: 4px 7px; font-size: 9px; }
  .show-pop-title { font-size: 8px; color: var(--dim); margin-bottom: 4px; }
  .show-row-wrap { margin-bottom: 5px; }
  .show-row { display: flex; align-items: center; gap: 6px; width: 100%; margin: 2px 0; padding: 3px 6px; font-size: 9px; min-height: 20px; border-width: 2px; background: #1a2350; color: var(--dim); text-align: left; }
  .show-row.on { border-color: #2fbf6a; color: var(--ink); background: #14301f; }
  .show-row .idx { color: var(--yellow); min-width: 14px; }
  .show-row .nm { flex: 1; }
  .show-row .cnt { font-size: 8px; color: var(--dim); }
  .win-wrap { margin: 2px 0 2px 20px; }
  .win-bar { position: relative; height: 12px; background: #0a0e22; border: 1px solid var(--dim); cursor: copy; user-select: none; }
  .win-seg { position: absolute; top: 0; bottom: 0; background: #2fbf6a; opacity: .85; cursor: grab; box-shadow: inset 0 0 0 1px #1a5c36; }
  .win-seg i { position: absolute; top: 0; bottom: 0; width: 3px; background: #0b1026; cursor: ew-resize; }
  .win-seg .win-hl { left: 0; }
  .win-seg .win-hr { right: 0; }
  .win-info { display: none; }
  .sf-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .sf-row .small { padding: 4px 6px; font-size: 9px; margin: 0; min-height: 24px; white-space: nowrap; }
  .sf-sep { width: 1px; height: 18px; background: var(--dim); opacity: .4; flex: none; }
  .sf-l { font-size: 7px; color: var(--dim); margin: 0; white-space: nowrap; }
  .sf-l.nm { color: var(--cyan); }
  .sf-n { width: 38px; padding: 3px 4px; font-size: 10px; }
  .sf-c { width: 28px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .sf-play { margin-left: auto; flex: none; }
  .draw-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; padding: 4px 0; border-bottom: 1px dashed #1a2350; }
  .draw-row .small { margin: 0; padding: 3px 7px; min-height: 22px; font-size: 8px; }
  .draw-row .dbtn.active { background: var(--yellow); color: #0b1026; border-color: #8a6d00; }
  .draw-row select.sf-n { width: 86px; padding: 2px 4px; font-size: 9px; }
  .draw-style { display: inline-flex; align-items: center; gap: 3px; padding: 2px 5px; min-height: 28px; border: 1px solid #2c3560; background: #101736; }
  .draw-style .sf-l { margin: 0; }
  .draw-style input[type=checkbox] { margin: 0; }
  .draw-style .sf-n { width: 42px; height: 22px; }
  .hint-inline { font-size: 8px; color: var(--dim); }
  .hint { font-size: 9px; color: var(--dim); line-height: 1.8; margin-top: 8px; }
  .hint b { color: var(--yellow); }
  .meta { font-size: 9px; color: var(--cyan); min-height: 12px; margin-top: 6px; }
  .cf-group { font-size: 9px; color: var(--yellow); letter-spacing: 1px; margin: 10px 0 2px; border-bottom: 1px dashed #2c3560; padding-bottom: 2px; }
  .props-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .props-head label { margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props-head .small { margin: 0; min-height: 26px; padding: 4px 10px; }
  #cfgform { flex: 1 1 0; height: 0; min-height: 100px; max-height: calc(100vh - 210px); overflow-y: auto; border: 2px solid #0a0e22; padding: 4px; margin-bottom: 6px; background: #0d1330; scrollbar-width: thin; scrollbar-color: #3a4678 #0a0e22; }
  #cfgform::-webkit-scrollbar { width: 8px; }
  #cfgform::-webkit-scrollbar-track { background: #0a0e22; }
  #cfgform::-webkit-scrollbar-thumb { background: #3a4678; border-radius: 4px; }
  #cfgform::-webkit-scrollbar-thumb:hover { background: #4a5890; }
  .layer-card { border: 2px solid #1a2350; background: #101736; margin: 3px 0; user-select: none; -webkit-user-select: none; } /* 整卡禁文本选择：拖拽走 HTML5 drag，不触发浏览器「拖拽搜索」 */
  /* 表单控件不继承父级 user-select（UA 默认保持可选）——必须直接设 none：否则从卡片内输入框拖起仍会触发 Edge「拖拽搜索」；输入仍可点击聚焦/键入（鼠标框选文本受限，可用键盘 Shift+方向键） */
  .layer-card input, .layer-card textarea, .layer-card select,
  .cf-box input, .cf-box textarea, .cf-box select,
  .layer-card button, .cf-box button { user-select: none; -webkit-user-select: none; }
  .layer-card.sel { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow); } /* 选中强调：黄色描线 */
  .layer-card.global { border-color: var(--dim); }
  .layer-card.img { border-color: #2a3a66; }
  .layer-card.drag { opacity: .5; border-color: var(--yellow); }
  .layer-card.insert-before { box-shadow: 0 -3px 0 var(--yellow); }
  .layer-card.insert-after { box-shadow: 0 3px 0 var(--yellow); }
  .layer-card.hid { opacity: .45; }
  .layer-head { display: flex; align-items: center; gap: 5px; padding: 4px 5px; cursor: pointer; font-size: 9px; user-select: none; -webkit-user-select: none; }
  .layer-head:hover { background: #16204a; }
  .lgrip { color: var(--dim); cursor: grab; }
  .layer-z { font-size: 8px; color: var(--yellow); min-width: 22px; }
  .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .layer-card.img .layer-name { color: var(--cyan); }
  .lcarr { color: var(--yellow); font-size: 8px; width: 8px; }
  .layer-head .hb { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; line-height: 1; }
  .layer-head .hb.hid { background: #33270f; color: var(--dim); }
  .layer-head .hb.on { background: #33270f; color: var(--yellow); }
  .cf-box { border: 1px dashed #2c3560; padding: 3px 4px; margin: 3px 0; background: #0b1128; }
  .cf-box[draggable=true] { cursor: grab; }
  .cf-box.drag { opacity: .45; border-color: var(--yellow); }
  .cf-box.insert-before { box-shadow: 0 -3px 0 var(--yellow); }
  .cf-box.insert-after { box-shadow: 0 3px 0 var(--yellow); }
  .part-head { display: flex; align-items: center; gap: 5px; min-height: 20px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .part-head .part-title { flex: 1; font-size: 8px; color: var(--ink); }
  .part-head .lgrip { font-size: 10px; }
  .part-head .hb { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; }
  .part-style { display: flex; align-items: center; gap: 5px; min-height: 24px; padding-top: 3px; font-size: 8px; color: var(--dim); }
  .part-style label { margin: 0; font-size: 8px; }
  .part-style input[type=color] { width: 23px; height: 19px; padding: 0; border: 1px solid var(--dim); }
  .part-style input[type=number] { width: 38px; padding: 2px 3px; font-size: 9px; }
  .part-extra { border-top: 1px dashed #2c3560; margin-top: 3px; padding-top: 2px; }
  .cf-box { user-select: none; -webkit-user-select: none; }
  .part-extra .part-legacy-style { display: none; }
  .layer-body { border-top: 1px dashed #2c3560; padding: 4px 6px 6px; }
  .cf-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .cf-row-inline { display: flex; align-items: center; gap: 6px; flex: 1; }
  .side-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .side-tab { flex: 1; margin: 0; padding: 4px 0; min-height: 24px; font-size: 10px; border-width: 2px; }
  .side-tab.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .cf-box.sel { border-color: #4dc3ff; }
  .cf-row label { flex: 1; margin: 0; font-size: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-row input[type=number] { width: 76px; }
  .cf-row input[type=text] { width: 110px; }
  .cf-row input[type=color] { width: 44px; height: 26px; padding: 0; border: 2px solid var(--dim); }
  .cf-row input[type=checkbox] { width: auto; }
  .cf-arr { display: flex; gap: 3px; flex-wrap: wrap; }
  .cf-arr input[type=color] { width: 22px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .cf-ro { font-size: 8px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<h1>像素风小动画装配器 · PIXEL SCENE BUILDER</h1>
<div class="sub">任意图片 → 像素化 → 拖拽装配（滚动/闪烁/脉动）→ 打开/保存场景 js（页面内直接改写配置，无需复制粘贴）。开发工具，不随游戏发布。</div>

<div class="cols">
  <!-- 左：素材导入 + 样式化 + 素材库 / 动画调整（双状态切换） -->
  <div class="panel p-import">
    <div class="side-tabs">
      <button class="side-tab active" data-panel="import">素材导入</button>
      <button class="side-tab" data-panel="anim">动画调整</button>
    </div>
    <div id="side-import">
      <label>导入素材（任意图片，非 8bit 亦可）</label>
      <div id="drop" class="drop">拖入图片 / 点击选择</div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <label><input type="checkbox" id="style-on" checked> 样式化（关 = 原样 1:1 显示）</label>
      <label>采样数（原图 ÷ N；像素化 = 缩小 N 倍采样，整数）</label>
      <div class="row">
        <input id="divisor" type="number" min="1" step="1" value="2" style="flex:1">
        <select id="alpha-mode" title="边缘透明像素：保留=默认软边；消除=alpha&lt;128 变透明 + alpha&gt;=128 拉满（一步到位只剩透明/不透明）；增强=全部半透明拉满">
          <option value="keep">边缘:保留</option>
          <option value="remove">边缘:消除</option>
          <option value="boost">边缘:增强</option>
        </select>
      </div>
      <label>减色色板（映射到有限色板最近色）</label>
      <select id="palette">
        <option value="">无（保持原色）</option>
        <option value="pico8">PICO-8 · 32 色（色彩丰富）</option>
        <option value="nes">NES · 16 色（红白机）</option>
        <option value="vga">VGA · 16 色（DOS 标准）</option>
        <option value="gb">Game Boy · 4 色（绿灰）</option>
      </select>
      <label>均匀量化（每通道色阶，0=关）</label>
      <input id="quant" type="range" min="0" max="8" value="0">
      <label>去背景容差（0=关；按左上角颜色抠除）</label>
      <input id="bgtol" type="range" min="0" max="60" value="0">
      <label>尺寸调整（处理后素材尺寸）</label>
      <div class="row">
        <input id="srcw" type="number" min="1" value="160" title="处理后宽度">
        <span>×</span><input id="srch" type="number" min="1" value="90" title="处理后高度">
        <label style="margin:0"><input id="src-lock" type="checkbox" checked> 锁比</label>
      </div>
      <label>素材库（点击选中，再"添加到场景"）</label>
      <div id="lib" class="lib"></div>
      <div class="row">
        <button id="btn-add" class="primary" style="flex:1">添加到场景 →</button>
        <button id="btn-del-src" style="flex:1">删除选中素材</button>
      </div>
      <button id="btn-background" class="primary">作为背景添加到场景 →</button>
      <div class="meta" id="m-import"></div>
    </div>
    <div id="side-anim" style="display:none">
      <div class="meta" id="m-anim-target"></div>
      <div id="anim-editor"></div>
    </div>
  </div>

  <!-- 中：场景文件 + 全局设置 + 画布 + 时间轴 -->
  <div class="panel p-stage">
    <div class="sf-row">
      <button id="btn-new" class="small">新建场景</button>
      <button id="btn-open" class="small">打开场景</button>
      <input id="jsfile" type="file" accept=".js,text/javascript,.json" hidden>
      <span class="sf-sep"></span>
      <label class="sf-l nm">全局</label>
      <label class="sf-l nm">宽</label><input id="gw" class="sf-n" type="number" value="320">
      <label class="sf-l nm">高</label><input id="gh" class="sf-n" type="number" value="118">
      <label class="sf-l nm">周期</label><input id="gloop" class="sf-n" type="number" value="48">
      <label class="sf-l"><input type="checkbox" id="showscene"> 场景层</label>
      <button id="btn-play" class="small primary sf-play">⏸</button>
    </div>
    <div class="draw-row" id="draw-row">
      <label class="sf-l nm">绘制</label>
      <button class="small dbtn active" data-mode="select">选择</button>
      <button class="small dbtn" data-mode="rect">矩形</button>
      <button class="small dbtn" data-mode="line">直线</button>
      <button class="small dbtn" data-mode="ellipse">椭圆</button>
      <button class="small dbtn" data-mode="poly">多边形</button>
      <span class="sf-sep"></span>
      <span class="draw-style"><label class="sf-l nm">填</label><input id="draw-fillon" type="checkbox" checked title="启用填充"><input id="draw-fillc" class="sf-c" type="color" value="#ffd23f"></span>
      <span class="draw-style"><label class="sf-l nm">描</label><input id="draw-strokeon" type="checkbox" title="启用描边"><input id="draw-strokec" class="sf-c" type="color" value="#000000"><label class="sf-l">宽</label><input id="draw-strokew" class="sf-n" type="number" value="1" min="0"></span>
      <label class="sf-l nm">目标</label>
      <select id="draw-target" class="sf-n" style="width:86px"><option value="new">新建元素</option><option value="sel">当前选中</option></select>
      <span class="hint-inline" id="draw-hint"></span>
    </div>
    <div id="stage-wrap" class="stage-wrap">
      <canvas id="home-scene"></canvas>
      <canvas id="stage" class="stage"></canvas>
      <canvas id="editor-overlay" class="editor-overlay"></canvas>
      <div id="zoom-badge" class="zoom-badge"></div>
    </div>
    <div id="scene-bar" class="scene-bar"></div>
    <div id="tl-label-top" class="timeline-labels top"></div>
    <canvas id="tl" class="timeline" width="320" height="20"></canvas>
    <div id="tl-label-bottom" class="timeline-labels"></div>
    <canvas id="tl-fx" class="timeline" width="320" height="18" style="display:none"></canvas>
    <div id="tl-bar" class="tl-bar"></div>
    <div class="meta" id="m-stage"></div>
    <div class="hint">
      画布<b>拖拽</b>移动、<b>拖右下角黄手柄</b>缩放、<b>点击</b>选中（图层栏自动定位展开）；时间轴点击/拖动跳转。
      顶部工具栏「打开 js」读场景文件，图层栏右上角「保存 js」写回——全程页面内完成。
    </div>
  </div>

  <!-- 右：图层栏（元素卡片） -->
  <div class="panel p-props">
    <div class="props-head">
      <label>图层（点击卡片展开调参 · 拖拽排序=z）</label>
      <button id="btn-particle" class="small">+ 粒子</button>
      <button id="btn-save" class="small primary">保存场景</button>
    </div>
    <div id="cfgform"></div>
    <div class="meta" id="m-props"></div>
  </div>
</div>

<script src="../public/home-scene.js" onerror="window.__sceneLoadFail = true"></script>
<script>
'use strict';

function buildExportText() {
  const els = state.elements.map(e => {

    '/* 目标网页放 <canvas id="scene-canvas"></canvas> 后粘贴本脚本 */\n' +
    'const SCENE = ' + JSON.stringify(cfg) + ';\n' +

// 提取 js 中的对象字面量（平衡括号，支持嵌套；JS 对象字面量用求值解析）
// 返回 {obj, start, end} 或 {err}（解析失败）或 null（未找到声明）
function extractObj(text, name) {
  const re = new RegExp('(?:const|let|var)\\s+' + name + '\\s*=\\s*(\\{)', 'm');
  const m = re.exec(text);
  if (!m) return null;
  let i = m.index + m[0].indexOf('{');
  const start = i;
  let depth = 0;
  for (; i < text.length; i++) {
    if (text[i] === '{') depth++;
    else if (text[i] === '}') { depth--; if (depth === 0) { i++; break; } }
  }
  const body = text.slice(start, i);
  try {
    const obj = new Function('return (' + body + ')')();
    return { obj, start, end: i };
  } catch (e) {
    return { err: '解析 ' + name + ' 失败：' + e.message };
  }
}

/* ---------------- 规范自检（详见 SCENE_SPEC.md） ---------------- */
function checkSceneSpec(cfg) {
  const warns = [];
  const n = cfg.scenes && cfg.scenes.length ? cfg.scenes.length : null;
  for (const [key, el] of Object.entries(cfg)) {
    if (!el || typeof el !== 'object' || Array.isArray(el) || key === 'images') continue;
    for (const k of Object.keys(el)) {
      // 1) 按场景散键：x3 / color3 等（存在基础键）
      const m = /^(.*?)(\d+)$/.exec(k);
      if (m && m[1] && Object.prototype.hasOwnProperty.call(el, m[1])) {
        warns.push('「' + key + '.' + k + '」疑似按场景散键——建议合并为 ' + m[1] + ': [v0,v1,…] 按场景数组（参数轨道）');
      }
      // 2) 数值数组长度 ≠ 场景数：只读结构数据
      const v = el[k];
      if (Array.isArray(v) && v.length > 1 && v.every(x => typeof x === 'number') && n && v.length !== n) {
        warns.push('「' + key + '.' + k + '」为数值数组（长度 ' + v.length + ' ≠ 场景数 ' + n + '）——仅展示不可编辑');
      }
    }
  }
  // 3) 用了 show:{scenes} 但未声明 scenes
  if (n === null) {
    let usedShow = false;
    for (const [key, el] of Object.entries(cfg)) {
      if (el && typeof el === 'object' && !Array.isArray(el) && el.show && Array.isArray(el.show.scenes)) usedShow = true;
    }
    if (usedShow) warns.push('使用了 show:{scenes:[..]} 但未声明 scenes 段名——分段语义按 4 段兜底，建议补充 scenes:["段名",…]');
  }
  return warns;
}

function showWindowStart(el) {

      const w = pi < s.length ? s[pi] : null;
      if (!w) return null;
      return Array.isArray(w[0]) ? w : [w];
    };
    const EPS = 1e-6;
    let cur = tlScene(); if (cur < 0) return 0;
    let curWins = winsOf(cur);
    if (!curWins) return 0;
    let seg = null;
    for (let i = 0; i < curWins.length; i++) {
      const [s0, s1] = tlSceneRange(cur);
      const lt = ((state.t % loop) + loop) % loop - s0;
      const dur = Math.max(0.001, s1 - s0);
      if (lt >= curWins[i][0] * dur && lt < curWins[i][1] * dur) { seg = curWins[i]; break; }

    while (cur > 0 && seg[0] < EPS) {
      const prevWins = winsOf(cur - 1);

      const prevEnd = prevWins.find(sg => sg[1] > 1 - EPS);
      if (!prevEnd) break;
      const [ps0, ps1] = tlSceneRange(cur - 1);
      seg = prevEnd;
      cur = cur - 1;
      if (ps1 - ps0 <= 0) break;
      if (seg[0] < EPS) continue;
      return ps0 + seg[0] * (ps1 - ps0);

/* FX 工具辅助（segs 模型）：读取 cfg.fx.segs 当前场景时段段 */
function fxSegsArr(cfg) {
  const fx = cfg.fx;
  if (!fx) return null;
  const n = Math.max(1, (cfg.scenes && cfg.scenes.length) || 1);
  if (!fx.segs || !fx.segs.length) { fx.segs = []; for (let i = 0; i < n; i++) fx.segs.push([{ f: [0, 1] }]); }
  while (fx.segs.length < n) fx.segs.push([{ f: [0, 1] }]);
  fx.segs.forEach((a, i) => { if (!a || !a.length) fx.segs[i] = [{ f: [0, 1] }]; });
  return fx.segs;
}
/* FX 时间轴轨（#tl-fx）：segs 分段可视化——每场景一组时段段色块；点击段 = 选中段 + 跳场景（面板同步）。
   颜色按段是否启用 A/B 效果着色（启用越多越亮）。 */
function renderFxTrack() {
  const cv = $('tl-fx');
  if (!cv || !cv.getContext) return;
  const cfg = window.HOME_SCENE;
  const hasFx = state.sceneParamsMode && cfg && cfg.fx && cfg.fx.segs && cfg.fx.segs.length;
  cv.style.display = hasFx ? '' : 'none';
  if (!hasFx) return;
  const scale = Math.max(2, window.devicePixelRatio || 1);
  const Wcss = cv.clientWidth || 320;
  const Hcss = 18;
  const W = Math.max(2, Math.round(Wcss * scale));
  const H = Math.max(2, Math.round(Hcss * scale));
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, Wcss, Hcss);
  const loop = tlLoop();
  const segs = cfg.fx.segs;
  const n = Math.max(1, (cfg.scenes && cfg.scenes.length) || 1);
  const borders = currentBorders(cfg);
  const segStart = i => borders ? (i === 0 ? 0 : borders[i - 1]) : i * loop / n;
  const segEnd = i => borders ? (i === borders.length ? loop : borders[i]) : (i + 1) * loop / n;
  // 段启用计数（亮度）
  const onCount = seg => {
    let c = 0;
    if (seg.crt) c++; if (seg.glitch) c++; if (seg.vignette) c++; if (seg.noise) c++;
    if (seg.palette && seg.palette !== 'none') c++; if (seg.hue) c++; if (seg.pixelDiv && seg.pixelDiv > 1) c++;
    return c;
  };
  for (let i = 0; i < n; i++) {
    const a = segStart(i), b = segEnd(i);
    const x0 = Math.round((a / loop) * Wcss), x1 = Math.round((b / loop) * Wcss);
    const arr = segs[i] || [{ f: [0, 1] }];
    arr.forEach(seg => {
      const fa = seg.f ? seg.f[0] : 0, fb = seg.f ? seg.f[1] : 1;
      const sx = Math.round(a + (b - a) * fa), ex = Math.round(a + (b - a) * fb);

  if (!v || !v.trim()) return;
  cfg.scenes.push(v.trim());
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length); // 各按场景数组沿用末位（bg 为字符串拷贝，独立可改）
  if (showPop) { showPop.remove(); showPop = null; showFocusEl = null; } // 场景结构变化：关闭 [S] 弹窗（其行数/窗口按旧场景数构建，重开即按新场景数）
  buildLayerList(layerCfg());
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}
function deleteScene(i) {
  const cfg = window.HOME_SCENE; if (!cfg) return;
  pushHistory();
  const oldN = cfg.scenes.length;
  cfg.scenes.splice(i, 1);
  if (!cfg.scenes.length) cfg.scenes = ['场景'];
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length, i);
  if (showPop) { showPop.remove(); showPop = null; showFocusEl = null; } // 场景结构变化：关闭 [S] 弹窗
  buildLayerList(layerCfg());
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}

/* ---------------- 场景层（home-scene.js 叠底）与画布尺寸 ---------------- */
// home-scene.js 硬编码 320×118：场景层开启时画布锁定该尺寸（素材层对齐叠加），关闭时可自定义
function syncCanvasSize() {
  const cfg = window.HOME_SCENE;
  if (state.showScene && cfg) {
    state.cw = cfg.w || 320; state.ch = cfg.h || 118;
  } else {
    state.cw = Math.max(32, parseInt($('gw').value) || 320);
    state.ch = Math.max(32, parseInt($('gh').value) || 118);
  }
}
$('showscene').addEventListener('change', () => {
  state.showScene = $('showscene').checked;
  $('home-scene').style.display = state.showScene ? 'block' : 'none';
  syncCanvasSize();
  renderStage();
  renderTimeline();
});

/* ---------------- 启动 ---------------- */
// 兜底副本：独立仓库（无 ../public/home-scene.js，如 CanvasCartoonBuilder）时加载本地 tools/home-scene.js
if (!window.HomeScene) {
  const fb = document.createElement('script');
  fb.src = 'home-scene.js';
  fb.onload = () => {
    if (window.HomeScene) {
      window.__sceneLoadFail = false;
      HomeScene.init(); // DOMContentLoaded 已过，需手动初始化
      if (window.HOME_SCENE) HomeScene.resize();
      if ($('m-stage').textContent.indexOf('场景层加载失败') >= 0) $('m-stage').textContent = '';
      $('home-scene').style.display = state.showScene ? 'block' : 'none';
      renderStage();
      renderTimeline();
    }
  };
  document.head.appendChild(fb);
}
renderLib();
renderStyleCtl();
createGenericScene(false);
syncGlobals();
ensureAllImages();
renderSceneBar();
renderTimeline();
syncCanvasSize();
resizeStageWrap(); // 显示框初始高度（默认 320×118 比例）
$('home-scene').style.display = state.showScene ? 'block' : 'none';
if (window.__sceneLoadFail) $('m-stage').textContent = '⚠ 场景层加载失败：未找到 ../public/home-scene.js（可取消勾选"场景层"）';
renderStage();
state.last = performance.now();
state.raf = requestAnimationFrame(loop);
</script>
</body>
