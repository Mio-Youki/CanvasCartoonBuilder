<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToSampool v4 Workbench</title>
<style>
  :root{color-scheme:dark;--bg:#17181b;--panel:#222428;--line:#3a3d43;--text:#e5e7eb;--muted:#9aa0aa;--accent:#4aa3e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,sans-serif}.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:#202226}.bar b{margin-right:auto}button{border:1px solid var(--line);border-radius:4px;background:#2b2e34;color:var(--text);padding:6px 10px;cursor:pointer}button:hover{border-color:var(--accent)}#app{display:grid;grid-template-columns:220px minmax(320px,1fr) 280px;height:calc(100vh - 46px)}aside,section{min-width:0}.tree,.inspector{background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto}.inspector{border-left:1px solid var(--line);border-right:0}.stage{display:grid;place-items:center;position:relative;overflow:auto}canvas{image-rendering:pixelated;max-width:92%;max-height:88%;background:#090a0c;border:1px solid #4b4e55}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 8px}.entity,.card{display:flex;align-items:center;gap:7px;padding:7px 6px;border-radius:4px;margin:2px 0}.entity{cursor:pointer}.entity.active{background:#17679d}.card{border:1px solid var(--line);align-items:flex-start}.card label{display:flex;gap:6px;align-items:center;cursor:pointer}.card small{display:block;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:4px;margin-bottom:9px}.tabs button.active{border-color:var(--accent);background:#1b597f}.notice{color:var(--muted);font-size:12px}.controller-title{font-size:11px;color:var(--muted);margin:12px 0 3px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.field{display:grid;gap:3px;color:var(--muted);font-size:11px}.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);border-radius:3px;background:#181a1e;color:var(--text);padding:5px}.field input[type=color]{height:29px;padding:2px}.status{position:absolute;bottom:12px;left:12px;color:var(--muted);background:#111a;padding:4px 7px;border-radius:3px}
</style>
<header class="bar"><b>ToSampool · v4 Workbench <small>实验入口</small></b><button id="new">新建 v4</button><button id="open">打开 v4</button><button id="import">导入图片</button><button id="save">保存 v4</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="toggle">播放</button></header>
<main id="app"><aside class="tree"><div class="section-title">场景对象</div><div id="entities"></div><p class="notice">此页只读取 v4 JSON，不会修改旧 JS 场景。</p></aside><section class="stage"><canvas id="preview" width="320" height="180"></canvas><span id="status" class="status"></span></section><aside class="inspector"><div class="section-title" id="context">对象效果</div><div class="tabs" id="tabs"></div><div id="cards"></div></aside></main>
<script src="editor/tauri-host-adapter.js"></script>
<script src="editor/host-adapter.js"></script>
<script src="editor/runtime-bridge.js"></script>
<script src="home-scene-vnext.js"></script>
<script src="editor/effect-registry-vnext.js"></script>
<script src="editor/vnext-inspector-model.js"></script>
<script src="editor/vnext-effect-state.js"></script>
<script src="editor/vnext-mask-state.js"></script>
<script src="editor/asset-resolver.js"></script>
<script src="editor/vnext-asset-loader.js"></script>
<script src="editor/vnext-scene.js"></script>
<script src="editor/vnext-workspace.js"></script>
<script src="editor/vnext-scene-mutation.js"></script>
<script src="editor/vnext-entity-state.js"></script>
<script src="editor/vnext-asset-state.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id), canvas=$('preview'), workspace=EditorVNextWorkspace.create(), changes=EditorVNextSceneMutation.create(workspace), ui={selected:null,page:'compose',playing:true,start:performance.now()};
  function starter(){workspace.createBlank({width:320,height:180,loop:4});workspace.mutate(scene=>scene.entities.push({id:'starter-orb',type:'ellipse',x:116,y:48,w:88,h:88,fill:'#7ec8f5',effects:{pipeline:['mask','decorate','sample'],mask:null,decorate:{},sample:{}}}));changes.clear();ui.selected='starter-orb';ui.page='compose'}
  function selected(){return workspace.current().entities.find(entity=>entity.id===ui.selected)||null}
  function renderTree(){const root=$('entities');root.innerHTML='';for(const entity of workspace.current().entities){const row=document.createElement('div');row.className='entity'+(entity.id===ui.selected?' active':'');row.textContent=`${entity.type||'rect'} · ${entity.id}`;row.onclick=()=>{ui.selected=entity.id;ui.page='compose';renderUI()};root.append(row)}}
  function at(value,key,fallback){let current=value;for(const part of String(key).split('.'))current=current&&current[part];return current==null?fallback:current}
  function effectConfig(owner,scope,card){const item=EditorEffectRegistryVNext.effectById[card.id],path=EditorVNextInspectorModel.path(scope,item);let value=owner;for(const part of path)value=value&&value[part];return value||{}}
  function renderEffectParams(owner,scope,card,body){if(!card.enabled)return;const config=effectConfig(owner||workspace.current(),scope,card),grid=document.createElement('div');grid.className='field-grid';for(const param of card.params){if(param.visibleFor&&config.mode!==param.visibleFor)continue;const label=document.createElement('label');label.className='field';label.append(document.createTextNode(param.label));let input;if(param.type==='select'){input=document.createElement('select');for(const option of param.options||[]){const node=document.createElement('option');node.value=option;node.textContent=option;input.append(node)}}else{input=document.createElement('input');input.type=param.type==='color'?'color':param.type==='number'?'number':'text';if(param.type==='number'){input.step=param.step||'any';if(param.min!=null)input.min=param.min;if(param.max!=null)input.max=param.max}}input.value=at(config,param.key,param.default);input.onchange=()=>{try{changes.run(`调整 ${card.name} · ${param.label}`,scene=>EditorVNextEffectState.setParam(scene,{scope,ownerId:owner&&owner.id,effectId:card.id,key:param.key,value:input.value}));renderUI()}catch(error){alert(error.message);renderUI()}};label.append(input);grid.append(label)}body.append(grid)}
  function renderControllers(owner,scope,model,cards){if(!model.cardsFor('sample').some(card=>card.storage==='sample'&&card.enabled))return;const heading=document.createElement('div');heading.className='controller-title';heading.textContent='共享采样控制';cards.append(heading);for(const controller of model.controllers){const box=document.createElement('div');box.className='card';const body=document.createElement('div');body.textContent=controller.name;const note=document.createElement('small');note.textContent=controller.purpose;body.append(note);const values=EditorVNextEffectState.controllerValues(workspace.current(),{scope,ownerId:owner&&owner.id,controllerId:controller.id}),grid=document.createElement('div');grid.className='field-grid';for(const param of controller.params){const label=document.createElement('label');label.className='field';label.append(document.createTextNode(param.label));let input;if(param.type==='select'){input=document.createElement('select');for(const option of param.options||[]){const node=document.createElement('option');node.value=option;node.textContent=option;input.append(node)}}else{input=document.createElement('input');input.type='number';input.step=param.step||'any';if(param.min!=null)input.min=param.min;if(param.max!=null)input.max=param.max}input.value=at(values,param.key,param.default);input.onchange=()=>{try{changes.run(`调整 ${controller.name} · ${param.label}`,scene=>EditorVNextEffectState.setController(scene,{scope,ownerId:owner&&owner.id,controllerId:controller.id,key:param.key,value:input.value}));renderUI()}catch(error){alert(error.message);renderUI()}};label.append(input);grid.append(label)}body.append(grid);box.append(body);cards.append(box)}}
  function renderCompose(owner,cards){if(!owner){cards.innerHTML='<p class="notice">场景尺寸、循环和背景将在后续接入；本页现只验证对象成样写入。</p>';return}const grid=document.createElement('div');grid.className='field-grid';for(const key of ['x','y','w','h','scaleX','scaleY','rot','alpha','fill']){const spec=EditorVNextEntityState.fields[key],label=document.createElement('label'),input=document.createElement('input');label.className='field';label.append(document.createTextNode(spec.label));input.type=spec.kind==='color'?'color':'number';if(spec.kind==='number'){input.step=key==='alpha'||key.startsWith('scale')?'.01':'1';if(spec.min!=null)input.min=spec.min;if(spec.max!=null)input.max=spec.max}input.value=EditorVNextEntityState.value(owner,key);input.onchange=()=>{try{changes.run(`调整 ${spec.label}`,scene=>EditorVNextEntityState.set(scene,{ownerId:owner.id,key,value:input.value}));renderUI()}catch(error){alert(error.message);renderUI()}};label.append(input);grid.append(label)}cards.append(grid)}
  function renderInspector(){const owner=selected(),scope=owner?'object':'scene',model=EditorVNextInspectorModel.create(scope,owner||workspace.current());$('context').textContent=owner?`对象效果 · ${owner.id}`:'场景效果';const tabs=$('tabs');tabs.innerHTML='';for(const page of model.pages){const button=document.createElement('button');button.textContent=page==='compose'?'成样':page==='decorate'?'加样':page==='overlay'?'叠加': '采样';button.className=page===ui.page?'active':'';button.onclick=()=>{ui.page=page;renderInspector()};tabs.append(button)}if(!model.pages.includes(ui.page))ui.page=model.pages[0];const cards=$('cards');cards.innerHTML='';if(ui.page==='compose'){renderCompose(owner,cards);return}if(ui.page==='sample')renderControllers(owner,scope,model,cards);for(const card of model.cardsFor(ui.page)){const box=document.createElement('div');box.className='card';const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=card.enabled;input.disabled=!card.editable;input.onchange=()=>{changes.run(input.checked?`启用 ${card.name}`:`停用 ${card.name}`,scene=>input.checked?EditorVNextEffectState.enable(scene,{scope,ownerId:owner&&owner.id,effectId:card.id}):EditorVNextEffectState.disable(scene,{scope,ownerId:owner&&owner.id,effectId:card.id}));renderUI()};label.append(input,document.createTextNode(card.name));const body=document.createElement('div');body.append(label);const note=document.createElement('small');note.textContent=card.editable?card.purpose:'Runtime 尚未支持';body.append(note);renderEffectParams(owner,scope,card,body);box.append(body);cards.append(box)}}
  function renderUI(){renderTree();renderInspector();$('undo').disabled=!changes.canUndo;$('redo').disabled=!changes.canRedo;$('undo').title=changes.undoLabel||'无可撤销操作';$('redo').title=changes.redoLabel||'无可重做操作'}
  async function frame(now){if(ui.playing&&workspace.hasDocument){try{const t=(now-ui.start)/1000,stats=await workspace.renderTo(canvas,t);$('status').textContent=`${stats.directObjects+stats.capsuleObjects} 对象 · ${stats.sceneEffects} 场景效果`}catch(error){$('status').textContent=error.message}}requestAnimationFrame(frame)}
  async function importImage(){try{const files=await EditorHost.pickAssets({accept:'image/*',multiple:false}),file=files&&files[0];if(!file)return;const dataUrl=await EditorHost.readDataUrl(file),image=await EditorVNextAssetLoader.imageFromDataUrl(dataUrl),result=changes.run(`导入图片 ${file.name||'素材'}`,scene=>EditorVNextAssetState.addImage(scene,{name:file.name,locator:file._patchariumLocator||dataUrl,mime:file.type,width:image.naturalWidth||image.width,height:image.naturalHeight||image.height}));ui.selected=result.entityId;ui.page='compose';renderUI()}catch(error){alert(error.message)}}
  $('new').onclick=()=>{starter();renderUI()};$('open').onclick=async()=>{try{await workspace.open();changes.clear();ui.selected=workspace.current().entities[0]?.id||null;ui.page=ui.selected?'compose':'overlay';ui.start=performance.now();renderUI()}catch(error){alert(error.message)}};$('import').onclick=importImage;$('save').onclick=async()=>{try{await workspace.save()}catch(error){alert(error.message)}};$('undo').onclick=()=>{if(changes.undo())renderUI()};$('redo').onclick=()=>{if(changes.redo())renderUI()};$('toggle').onclick=()=>{ui.playing=!ui.playing;$('toggle').textContent=ui.playing?'暂停':'播放'};
  starter();renderUI();requestAnimationFrame(frame);
})();
</script>
