<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>图层消逝 · ToSampool</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#11151b;color:#eee}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1300px;margin:auto}header{display:flex;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:20px;margin:0}button,input,select{font:inherit;border:1px solid #444d5b;background:#222832;color:inherit;padding:7px;border-radius:4px}button{cursor:pointer}button.primary{background:#ffd23f;color:#171b22;border-color:#ffd23f}main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}article{min-width:0}.stage{position:relative;background:repeating-conic-gradient(#282e38 0 25%,#222832 0 50%) 0/20px 20px;border:1px solid #444d5b}canvas{width:100%;height:auto;display:block;image-rendering:auto}.small{width:180px;border:1px solid #444d5b;margin-top:16px}aside{display:grid;align-content:start;gap:14px}label{display:grid;gap:6px;font-size:13px}label.inline{display:flex;align-items:center;gap:8px}.row{display:flex;gap:8px;align-items:center}.row input{width:100%}#status{font-size:12px;color:#adc0d4;line-height:1.7}#seek{width:100%;padding:0;margin-top:15px}p{line-height:1.6;color:#aeb9c8;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:12px}aside{grid-template-columns:1fr 1fr}}
</style>
<header><h1>图层消逝</h1><button id="play" class="primary">播放</button><button id="reset">回到起点</button></header>
<main><article><div class="stage"><canvas id="output"></canvas></div><input id="seek" type="range" min="0" max="2" step=".01" value="0"><div class="row"><canvas id="original" class="small"></canvas><p>左侧为引用对象原画面。<br>起点保持原位与原色，随后切片飞散、淡出。</p></div></article>
<aside>
<label>引用对象<select id="kind"><option value="image">图片</option><option value="vector">矢量对象</option><option value="text">文字对象</option></select></label>
<label>导入图片<input id="file" type="file" accept="image/*"></label>
<label>切片尺寸<input id="cell" type="number" min="1" max="256" step="1" value="16"></label>
<label>持续时间<input id="life" type="number" min=".1" step=".1" value="2"></label>
<label>速度<input id="speed" type="number" min="0" step="1" value="35"></label>
<label>方向<input id="direction" type="number" step="5" value="-90"></label>
<label>扩散角<input id="spread" type="number" min="0" max="360" step="5" value="150"></label>
<label>重力<input id="gravity" type="number" step="1" value="12"></label>
<label>旋转速度<input id="spinSpeed" type="number" step="5" value="0"></label>
<label>随机种子<input id="seed" type="number" step="1" value="1"></label>
<label class="inline"><input id="fade" type="checkbox" checked>淡出</label><output id="status"></output>
</aside></main>
<script src="../../home-scene-vnext.js"></script><script src="../../editor/experiments/layer-fragment-probe.js"></script><script src="preview.js"></script></html>
