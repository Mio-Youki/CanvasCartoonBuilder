<!doctype html>
<meta charset="utf-8">
<title>Patcharium Runtime Performance Baseline</title>
<style>body{font:14px system-ui;background:#111827;color:#e5e7eb;margin:20px}button{padding:7px 12px}canvas{display:block;max-width:480px;margin:12px 0;background:#000}pre{white-space:pre-wrap}.pass{color:#6ee7b7}.fail{color:#fca5a5}</style>
<h1>Runtime Performance Baseline</h1>
<button id="run">Run M / L</button><canvas id="home-scene"></canvas><pre id="out">READY</pre>
<script>
function sourceUrl(){const c=document.createElement('canvas');c.width=320;c.height=180;const g=c.getContext('2d');const grad=g.createLinearGradient(0,0,320,180);grad.addColorStop(0,'#16324f');grad.addColorStop(.5,'#d17b49');grad.addColorStop(1,'#f3d8a6');g.fillStyle=grad;g.fillRect(0,0,320,180);for(let i=0;i<700;i++){g.fillStyle='rgba('+(i%255)+','+((i*7)%255)+','+((i*13)%255)+',.35)';g.fillRect((i*47)%320,(i*29)%180,2+(i%5),2+(i%3));}return c.toDataURL();}
const src=sourceUrl(),out=document.getElementById('out');
function scene(w,h){return{format:'canvas-cartoon-scene',formatVersion:1,kind:'generic',name:'Perf '+w+'x'+h,w,h,loop:4,bg:'#10151f',transparent:false,scenes:['A'],sceneBorders:[],images:[{id:'photo',name:'photo',src,x:0,y:0,w,h,z:1,alpha:1,pixelDiv:2,show:[[[0,1]]],style:{samplingMotion:{show:[[[0,1]]],field:{type:'wave',scale:48,speed:1,angle:20,period:4,steps:24,seed:1},edge:{mode:'alpha',width:3,strength:1},pixelBoil:{rate:5,amount:2,mode:'step',seed:7},thresholdPulse:{threshold:128,amount:24,period:2,steps:12,dark:'#182033',light:'#e8dbc3'},ditherDrift:{cell:6,direction:'diagonal',period:2,steps:12,dark:'#182033',light:'#e8dbc3'},grainTide:{amount:.65,coarseness:5,targets:'combined'}}}}],fx:{palette:'gameboy',pixelDiv:2,hue:0,brightness:0,contrast:1,saturation:1}};}
function p95(values){const s=values.slice().sort((a,b)=>a-b);return s[Math.max(0,Math.ceil(s.length*.95)-1)]||0;}
async function measure(label,w,h,mult){window.HOME_SCENE=scene(w,h);HomeScene.clearImageCache();HomeScene.resize();HomeScene.setPreviewOptions({pixelDivMultiplier:mult});await new Promise(r=>setTimeout(r,100));for(let i=0;i<3;i++)HomeScene.seek(i/12);const times=[],stats=[];for(let i=0;i<12;i++){const a=performance.now();HomeScene.seek(i/12);times.push(performance.now()-a);stats.push(HomeScene.getLastFrameStats());}return{label,mode:mult===1?'Full':'Draft',p95:+p95(times).toFixed(2),avg:+(times.reduce((a,b)=>a+b,0)/times.length).toFixed(2),workPixels:Math.round(stats.reduce((a,s)=>a+s.workPixels,0)/stats.length),passes:+(stats.reduce((a,s)=>a+s.pixelPasses,0)/stats.length).toFixed(1),cacheHits:stats.reduce((a,s)=>a+s.cacheHits,0),cacheMisses:stats.reduce((a,s)=>a+s.cacheMisses,0),offscreenPeakPixels:Math.max(...stats.map(s=>s.offscreenPeakPixels))};}
async function run(){out.className='';out.textContent='RUNNING';try{const rows=[];for(const [label,w,h] of [['M',960,540],['L',1920,1080]]){rows.push(await measure(label,w,h,1));rows.push(await measure(label,w,h,2));}out.className='pass';out.dataset.status='pass';out.textContent='PASS\n'+rows.map(r=>r.label+' '+r.mode+' — P95 '+r.p95+'ms / avg '+r.avg+'ms / work '+(r.workPixels/1e6).toFixed(2)+'MP / '+r.passes+' passes / cache '+r.cacheHits+':'+r.cacheMisses+' / offscreen '+(r.offscreenPeakPixels/1e6).toFixed(2)+'MP').join('\n');}catch(error){out.className='fail';out.dataset.status='fail';out.textContent='FAIL\n'+error.stack;}}
document.getElementById('run').onclick=run;
</script>
<script src="../home-scene.js"></script>
