<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>ToSampool · 旧媒介工作台</title>
  <script defer src="vendor/alpine.min.js"></script>
  <style>
    :root {

      --ink-sample: #e3ad4e;

      --ink-blue: #79b9d9;

      font-size: var(--type-body);

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1110px; background: #10171b; color: var(--ink); overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    svg.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
    .tiny { font-size: var(--type-caption); letter-spacing: .04em; }
    .bench {
      display: grid;
      grid-template-columns: var(--left-w, 270px) minmax(0, 1fr) var(--right-w, 348px);

      gap: var(--shell-gap);
      height: 100vh;
      min-height: 680px;
      padding: 8px;
      background: radial-gradient(ellipse at 50% -30%, #263238, #10171b 68%);

    [x-cloak] { display: none !important; }
    .command-deck, .tool-deck {

      min-width: 0;
      border: 1px solid #6e5b3d;
      background: linear-gradient(#e4dbcd,#ECE5D6);
      box-shadow: inset 0 1px #fff3d5, 0 3px 0 #5d4b34, 0 5px 8px #0008;
    }
    .command-deck { grid-row: 1; display:grid; place-items:center; }
    .tool-deck { grid-row: 2; display:grid; grid-template-columns:var(--left-w, 270px) minmax(0,1fr) var(--right-w, 348px); gap:var(--shell-gap); padding:0; border-radius:14px; box-shadow:inset 0 2px 5px #4b382d66,inset 0 -1px #fff4db,0 3px 0 #5d4b34,0 5px 8px #0008; }
    .brand-plaque { display:flex; align-items:center; justify-content:center; gap:10px; color:#3b2b1d; }

    .brand-mark i { background: #3b2b1d; }
    .brand-mark i:nth-child(2) { background: #cf8e36; }
    .brand-plaque strong { font-family: Consolas, "Cascadia Mono", monospace; font-size: 16px; letter-spacing: .13em; white-space: nowrap; }
    .hardware-bay { min-width:0; position:relative; margin:4px 3px; border:2px solid #31281c; border-radius:12px; padding:2px 5px 4px; background:transparent; box-shadow:inset 0 0 0 1px #f6e6c4,0 1px 0 #f6e6c4; }
    .bay-keys { display:flex; align-items:center; justify-content:space-around; gap:3px; height:59px; }
    .console-key { flex:1 1 0; min-width:0; height:59px; border:0; background:transparent; color:#332b20; padding:0 1px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font:700 12px "Microsoft YaHei UI",sans-serif; white-space:nowrap; }
    .console-key .key-cap { width:var(--key-size); height:var(--key-size); display:grid; place-items:center; border:2px solid #2a2117; border-radius:8px; color:#32291f; background:linear-gradient(#e4dbcd,#ECE5D6); box-shadow:0 0 0 2px #cfb891,inset 0 1px #fff1d2,inset 0 -1px #806d50; transition:transform 90ms,box-shadow 90ms,background 90ms; }
    .hardware-bay:not(.tools) .key-cap { width:calc(100% - 4px); }
    .console-key .key-cap .ico { width:18px; height:18px; stroke-width:2; }
    .console-key:hover .key-cap { transform:translateY(1px); box-shadow:0 0 0 2px #ddcbac,inset 0 1px #fff; }
    .console-key:active .key-cap { transform:translateY(3px); box-shadow:inset 0 1px #8d9184; }
    .console-key.selected .key-cap { background:linear-gradient(#ffe398,#e6aa34); box-shadow:0 0 0 2px #f7e2be,inset 0 0 10px #fff4b6; }
    .console-key .key-label { display:block; line-height:1; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .hardware-bay.tools .console-key { color:#34291d; width:42px; flex:0 0 42px; }

    .hardware-bay.tools .console-key.selected .key-cap { color:#201d15; background:linear-gradient(#ffe496,#d9a635); box-shadow:0 0 0 2px #ae9774,inset 0 0 10px #fff3b0; }

    .tool-readout .readout-pair input[type=number] { width:50px; height:25px; padding:2px 4px; border:1px solid #586461; border-radius:0; background:#1a2226; color:var(--amber-hi); font:var(--type-control) Consolas,monospace; }
    .tool-readout .readout-pair input[type=color] { width:29px; height:24px; padding:2px; border:1px solid #586461; border-radius:0; background:#1a2226; cursor:pointer; }

    .unit {
      min-height: 0;

      background: linear-gradient(135deg, var(--casing-hi), var(--casing) 18%, #f0e8db 90%);

    .screen {
      position: relative;
      min-height: 0;
      min-width: 0;
      height: 100%;

      border: 3px solid #293033;
      background: var(--screen);
      box-shadow: inset 0 0 0 1px #66706b, inset 0 0 24px #000;
    }
    .pane-screen::after { content:""; position:absolute; bottom:0; right:0; width:39px; height:3px; pointer-events:none; background:linear-gradient(90deg,var(--ink-source) 0 33%,var(--ink-cut) 33% 66%,var(--ink-sample) 66%); }
    .left-column .pane-screen::after { left:0; right:0; width:auto; background:linear-gradient(90deg,var(--ink-source) 0 calc(100% - 26px),var(--ink-cut) calc(100% - 26px) calc(100% - 13px),var(--ink-sample) calc(100% - 13px)); }
    .left-column { grid-column: 1; grid-row: 3 / 5; display: grid; grid-template-rows: minmax(180px, 52%) 8px minmax(150px, 1fr); min-height: 0; }
    .left-divider { cursor: row-resize; position: relative; }
    .left-divider::after { content:""; position:absolute; left:42%; right:42%; top:3px; height:2px; background:#b4a07c; }
    .left-column .unit { padding: 6px; }
    .left-column .lower-unit { display:flex; flex-direction:column; }
    .lower-unit .screen { flex:1; height:auto; }
    .lower-screen-actions { height:27px; flex:none; display:flex; justify-content:flex-end; align-items:center; gap:3px; padding:0 7px; border-bottom:1px solid var(--screen-line); }
    .pane-screen { display: flex; flex-direction: column; }
    .screen-head { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 8px; border-bottom: 1px solid var(--screen-line); color: var(--amber-hi); font: 700 var(--type-section) Consolas, "Microsoft YaHei UI", sans-serif; letter-spacing: .03em; }
    .screen-head .head-title { display: flex; align-items: center; gap: 7px; }
    .head-line { width: 12px; height: 3px; background: var(--ink-cut); box-shadow:3px 1px 0 var(--ink-source); }
    .head-actions { display:flex; gap:3px; }
    .screen-action { width:24px; height:22px; padding:0; border:1px solid transparent; background:transparent; color:var(--amber-dim); display:grid; place-items:center; }
    .screen-action:hover,.screen-action:focus-visible { color:var(--amber-hi); border-color:var(--screen-line); background:#272b2d; }
    .screen-action .ico { width:14px; height:14px; }
    .tree-scroll, .lower-scroll, .inspector-scroll { position:relative; min-height:0; overflow-x:hidden; overflow-y:auto; scrollbar-width:none; }
    .tree-scroll::-webkit-scrollbar, .lower-scroll::-webkit-scrollbar, .inspector-scroll::-webkit-scrollbar { display:none; width:0; height:0; }
    .screen-scroll-rail { position:absolute; z-index:5; top:0; right:0; width:16px; height:100%; background:transparent; cursor:pointer; touch-action:none; }
    .screen-scroll-rail::before { content:""; position:absolute; top:0; right:0; bottom:0; width:3.5px; background:var(--ink-sample); }
    .screen-scroll-thumb { position:absolute; top:0; right:0; width:3.5px; height:100%; border-radius:0; background:var(--ink-source); pointer-events:none; }
    .tree-scroll { padding:8px 16px 8px 5px; }
    .tree-root { margin:1px 2px 0; }
    .tree-children { margin:0 2px 0 12px; border-left:1px solid #66716c; padding:5px 0 6px; }
    .tree-element-children { margin:0 0 3px 14px; border-left:1px solid #66716c; }

    .tree-row { --row-ink:var(--amber-hi); display:flex; align-items:center; gap:5px; min-height:32px; padding:0 5px; color:var(--ink); white-space:nowrap; font-size:var(--type-control); outline:1px solid transparent; outline-offset:-1px; cursor:pointer; }
    .tree-row.depth-1 { padding-left:18px; }
    .tree-row.depth-2 { padding-left:33px; }
    .tree-row:hover:not(.current),.tree-row:focus-within:not(.current) { outline-color:var(--row-ink); }
    .tree-row.current { background:var(--row-ink); color:#12191b; outline-color:var(--row-ink); }
    .tree-row.dim { color:var(--muted); }

    .tree-row .expander { width:13px; height:23px; flex:none; text-align:center; color:var(--amber-dim); font:700 15px/23px Consolas,monospace; }
    .tree-row button.expander { padding:0; border:0; background:none; cursor:pointer; }
    .tree-row.current .expander,.tree-row.current .state-button { color:#12191b; }
    .tree-row .node-mark { width:13px; height:13px; flex:none; border:1px solid currentColor; opacity:.85; }
    .tree-row .node-mark.circle { border-radius:50%; }

    .tree-row .node-name { overflow:hidden; text-overflow:ellipsis; flex:1; }
    .tree-row .state-button { flex:none; width:20px; height:20px; padding:0; border:0; color:var(--muted); background:transparent; display:grid; place-items:center; opacity:0; }
    .tree-row:hover .state-button,.tree-row:focus-within .state-button,.tree-row .state-button.on { opacity:1; }
    .tree-row .state-button:hover, .tree-row .state-button.on { color:var(--amber-hi); }
    .tree-row .state-button .ico { width:13px; height:13px; }
    .tree-row .state-button.on { background:#334b48; }
    .tree-row.current .state-button.on { color:#12191b; background:#ffffff55; }
    .tab-strip { display:flex; flex:none; height:33px; border-bottom:1px solid var(--screen-line); }
    .tab-strip button { flex:1; border:0; border-right:1px solid #394246; background:transparent; color:var(--muted); font-weight:700; font-size:var(--type-control); }
    .tab-strip button:last-child { border-right:0; }
    .tab-strip button:hover { color:var(--amber-hi); background:#293035; }
    .tab-strip button.active { color:#171819; background:#e6dfc8; box-shadow:inset 0 -3px var(--ink-source); }
    .signal-viewport { position:relative; flex:1; min-height:0; overflow:hidden; }
    .signal-viewport > .lower-scroll,.signal-viewport > .inspector-scroll { height:100%; }
    .side-signal { view-transition-name:side-signal; }
    .inspector-signal { view-transition-name:inspector-signal; }
    .bench[data-transition-scope="side"] .inspector-signal,.bench[data-transition-scope="inspector"] .side-signal { view-transition-name:none; }
    ::view-transition-old(root),::view-transition-new(root) { animation:none; }
    ::view-transition-group(side-signal),::view-transition-group(inspector-signal) { animation-duration:210ms; animation-timing-function:linear; }
    ::view-transition-old(side-signal),::view-transition-old(inspector-signal) { animation:signal-out 105ms steps(5,end) both; }
    ::view-transition-new(side-signal),::view-transition-new(inspector-signal) { animation:signal-lock 155ms 55ms steps(7,end) both; }
    @keyframes signal-out {
      0% { opacity:1; transform:translateX(0) scaleX(1); filter:brightness(1); clip-path:inset(0); }
      35% { opacity:.95; transform:translateX(-3px) scaleX(1.012); filter:brightness(1.3); clip-path:inset(0 0 3% 0); }
      65% { opacity:.82; transform:translateX(4px) scaleX(1.025); filter:brightness(.8); clip-path:inset(13% 0 29% 0); }
      100% { opacity:0; transform:translateX(-2px) scaleX(1.035); filter:brightness(.5); clip-path:inset(49% 0 49% 0); }
    }
    @keyframes signal-lock {
      0% { opacity:0; transform:translateX(4px) scaleX(1.025); filter:brightness(1.5); clip-path:inset(49% 0 49% 0); }
      30% { opacity:.7; transform:translateX(-3px) scaleX(1.014); filter:brightness(.85); clip-path:inset(19% 0 22% 0); }
      55% { opacity:.9; transform:translateX(2px) scaleX(1.006); filter:brightness(1.12); clip-path:inset(0); }
      100% { opacity:1; transform:translateX(0) scaleX(1); filter:brightness(1); clip-path:inset(0); }
    }
    @media(prefers-reduced-motion:reduce){::view-transition-old(side-signal),::view-transition-old(inspector-signal),::view-transition-new(side-signal),::view-transition-new(inspector-signal){animation-duration:.01ms!important;animation-delay:0ms!important}}
    .inspector-tabs button:nth-child(1).active { box-shadow:inset 0 -3px var(--ink-source); }
    .inspector-tabs button:nth-child(2).active { box-shadow:inset 0 -3px var(--ink-cut); }
    .inspector-tabs button:nth-child(3).active { box-shadow:inset 0 -3px var(--ink-sample); }
    .lower-scroll { padding:7px 16px 7px 9px; }

    .effect-stage:first-child { margin-top:0; }

    .stage-heading { display:flex; align-items:center; gap:6px; color:var(--amber-dim); font:700 var(--type-section) Consolas,"Microsoft YaHei UI",sans-serif; letter-spacing:.03em; min-height:27px; padding:1px 6px; border-bottom:1px solid #43504d; background:#1b2528; }

    .subframe-title .spacer { flex:1; }
    .time-key,.motion-toggle { width:24px; height:24px; display:grid; place-items:center; padding:0; border:0; background:transparent; color:var(--ink-source); }

    .time-key:hover { background:#00994435; color:#34bd72; }
    .time-key.on { background:var(--ink-time); color:#f7f4e8; }
    .subsection { margin:0 0 13px; }

    .compose-inspector > .subsection::after { content:""; position:absolute; right:-1px; bottom:-1px; width:6px; height:6px; border-right:1px solid var(--ink-source); border-bottom:1px solid var(--ink-source); }
    .compose-inspector > .subsection .subsection-head { margin:0 -8px 5px; padding:0 8px; background:#1b282a; }
    .compose-inspector > .subsection .subsection-head .motion-toggle { margin-left:auto; }
    .v4-transform-preview-body { display:flex; flex-direction:column; gap:0; }
    .v4-transform-preview-row { display:grid; grid-template-columns:54px repeat(2,minmax(0,1fr)); gap:5px; align-items:center; min-height:34px; color:var(--ink); font-size:var(--type-control); }
    .v4-transform-preview-row>span { color:var(--muted); }
    .v4-transform-preview-row label { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:4px; min-width:0; }
    .v4-transform-preview-row label small { font:var(--type-caption) Consolas,monospace; color:var(--muted); white-space:nowrap; }
    .v4-transform-preview-row input,.v4-transform-preview-row select { min-width:0; width:100%; height:26px; border:0; background:transparent; color:var(--ink); font:var(--type-control) Consolas,monospace; }
    .v4-transform-preview-row input:hover,.v4-transform-preview-row input:focus,.v4-transform-preview-row select:hover,.v4-transform-preview-row select:focus { outline:1px solid var(--ink-source); background:#203137; }
    .v4-transform-preview-divider { height:1px; margin:5px 0; background:#3d4749; }
    .v4-transform-pivot { width:100%; min-height:26px; border:1px solid #51605e; background:transparent; color:var(--ink); font:var(--type-control) Consolas,monospace; }
    .subsection-head { display:flex; align-items:center; gap:5px; min-height:29px; color:var(--ink); border-bottom:1px solid #3d4749; margin-bottom:7px; font-size:var(--type-section); font-weight:700; }
    .subsection-head .spacer { flex:1; }
    .motion-toggle { color:var(--amber-dim); }
    .motion-toggle:hover { background:#79b9d935; color:var(--amber-hi); }
    .motion-toggle.on { background:var(--ink-blue); color:#10191d; }
    .param-row { display:grid; grid-template-columns:72px minmax(0,1fr); gap:7px; align-items:center; min-height:34px; color:var(--ink); font-size:var(--type-control); }
    .param-row.double { grid-template-columns:72px minmax(0,1fr) minmax(0,1fr); }
    .param-row input, .param-row select { width:100%; min-width:0; height:27px; background:#1a2226; border:1px solid #586461; color:var(--amber-hi); padding:2px 6px; border-radius:0; font:var(--type-control) Consolas,monospace; }
    .param-row input[type=range] { padding:0; accent-color:var(--amber); height:18px; }
    .param-row .numeric { display:flex; align-items:center; gap:5px; }
    .param-row .numeric small { color:var(--amber-dim); font:var(--type-caption) Consolas,monospace; }
    .swatch-field { width:25px; height:23px; border:1px solid #e7ca74; background:#edb559; display:inline-block; }
    .effect-gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .effect-tile { position:relative; min-height:91px; width:100%; border:1px solid #65706d; background:#161d20; color:#d8d6ca; padding:0; text-align:left; overflow:hidden; display:flex; flex-direction:column; }
    .effect-tile:hover { border-color:var(--ink-source); background:#242b2d; }
    .effect-tile.active { background:#284a48; color:#f5efe1; border-color:var(--ink-source); }
    .effect-tile.active:hover { background:#315956; }
    .effect-tile.selected { outline:2px solid var(--ink-sample); outline-offset:1px; }
    .effect-tile .tile-name { display:block; flex:none; height:25px; padding:4px 7px; border-bottom:1px solid #727b74; font:700 var(--type-control) Consolas,"Microsoft YaHei UI",sans-serif; letter-spacing:.04em; }
    .effect-tile .tile-art { flex:1; display:grid; place-items:center; overflow:hidden; position:relative; font:700 40px Consolas,monospace; letter-spacing:-.07em; line-height:1; }
    .effect-tile.selected .tile-art::after { content:""; position:absolute; right:5px; bottom:5px; width:18px; height:3px; background:linear-gradient(90deg,var(--ink-source) 0 33%,var(--ink-cut) 33% 66%,var(--ink-sample) 66%); }
    .effect-tile .tile-art span { display:block; transition:transform 250ms steps(3,end),text-shadow 250ms steps(3,end),filter 250ms steps(3,end); }
    .effect-tile:hover .tile-art span { transform:translate(2px,-1px); }
    .effect-tile .tile-art.projection span { text-shadow:5px 5px var(--ink-cut); }
    .effect-tile .tile-art.outline span { -webkit-text-stroke:2px var(--ink-sample); color:transparent; }
    .effect-tile .tile-art.tint { background:linear-gradient(90deg,#d66b6038 0 33%,#e3ad4e30 33% 66%,#81c9bd38 66%); }
    .effect-tile .tile-art.tint span { text-shadow:-5px 0 var(--ink-cut),5px 0 var(--ink-source); }
    .effect-tile .tile-art.texture { background:repeating-linear-gradient(0deg,transparent 0 5px,#e3ad4e46 5px 6px); }
    .effect-tile .tile-art.inner span { text-shadow:0 0 4px var(--ink-sample),0 0 11px var(--ink-cut); }
    .effect-tile .tile-art.outer span { text-shadow:-4px 0 var(--ink-cut),4px 0 var(--ink-source),0 4px var(--ink-sample); }
    .effect-tile .tile-art.halftone span { display:block; width:48px; height:43px; font-size:0; color:var(--ink-sample); background:radial-gradient(circle,currentColor 36%,transparent 42%) 0 0 / 10px 10px; }
    .effect-tile .tile-art.threshold { background:linear-gradient(90deg,#813c39 0 48%,#1a2326 48%); }
    .effect-tile .tile-art.threshold span { filter:contrast(4); }
    .effect-tile .tile-art.offset { background:repeating-linear-gradient(180deg,transparent 0 15px,#d66b6030 15px 18px); }
    .effect-tile .tile-art.offset span { text-shadow:5px 1px var(--ink-cut),-3px -1px var(--ink-source); }
    .effect-tile .tile-art.dispersion { background:linear-gradient(90deg,#d66b6030 0 33%,#e3ad4e22 33% 66%,#81c9bd30 66%); }
    .effect-tile .tile-art.dispersion span { text-shadow:-4px 0 var(--ink-cut),4px 0 var(--ink-source); }
    .tile-power { position:absolute; top:2px; right:3px; z-index:2; width:22px; height:19px; border:0; background:transparent; color:var(--ink-source); display:grid; place-items:center; padding:0; }
    .tile-power:hover { background:#81c9bd44; }
    .effect-tile.active .tile-power { background:var(--ink-source); color:#142521; }
    .tile-power .ico { width:12px; height:12px; stroke-width:2.1; }
    .effect-detail { position:relative; margin-top:15px; border:1px solid #697470; background:#121b1e; padding:0 9px 9px; }
    .effect-detail::after { content:""; position:absolute; right:-1px; bottom:-1px; width:8px; height:8px; border-right:1px solid var(--ink-sample); border-bottom:1px solid var(--ink-sample); }
    .detail-title { display:flex; align-items:center; gap:7px; min-height:31px; margin:0 -9px 5px; padding:0 9px; border-bottom:1px solid #4b5a58; background:#1c2728; color:var(--amber-hi); font-size:var(--type-section); font-weight:700; }
    .detail-title::before { content:"EDIT /"; color:var(--ink-sample); font:700 var(--type-caption) Consolas,monospace; }
    .detail-title .spacer { flex:1; }
    .detail-title .time-key { flex:none; }
    .detail-copy { margin:2px 0 8px; color:var(--muted); font-size:var(--type-control); line-height:1.5; }
    .detail-params { border-top:1px solid #3d4c4a; padding-top:6px; }
    .timeline-dock { grid-column:2 / 4; grid-row:4; min-width:0; display:flex; flex-direction:column; padding:4px 8px 7px; background:linear-gradient(#e4dbcd,#ECE5D6); border:1px solid #675637; box-shadow:inset 0 1px #fff2d6,0 3px 0 #0c0d0a; }
    .timeline-head { display:flex; align-items:center; gap:6px; height:36px; flex:none; position:relative; overflow:visible; color:#3e3020; }
    .play-key { width:45px; height:45px; flex:none; align-self:flex-start; margin-top:1px; position:relative; z-index:2; border-radius:50%; padding:0; border:2px solid #2d261d; background:linear-gradient(#4d4840,#20211f); color:#f3e5c8; box-shadow:inset 0 1px #a49b84,0 2px #655337; display:grid; place-items:center; }
    .play-key.playing { transform:translateY(2px); background:linear-gradient(#263335,#152125); box-shadow:inset 0 2px 4px #000; }
    .play-key .ico { width:18px; height:18px; fill:currentColor; stroke-width:1; }
    .transport-lights { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; width:12px; height:45px; flex:none; align-self:flex-start; margin-top:1px; position:relative; z-index:2; }
    .transport-lights span { display:block; line-height:0; }
    .transport-lights i { display:block; width:10px; height:10px; border-radius:50%; border:1px solid #574b39; background:#655548; }
    .transport-lights span:first-child.on i { background:#24c7a4; box-shadow:0 0 5px #38e2b6; }
    .transport-lights span:last-child.on i { background:#f3bf39; box-shadow:0 0 5px #ffe079; }
    .timeline-readout { position:absolute; left:84px; margin-left:0; width:min(395px, calc(100% - 84px)); height:29px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 9px; border:2px solid #403e31; background:var(--screen); color:var(--amber-hi); box-shadow:inset 0 0 0 1px #2b6a71,inset 0 0 9px #000; font-size:var(--type-control); white-space:nowrap; }
    .timeline-readout strong { color:var(--amber); font:700 var(--type-control) Consolas,monospace; flex:none; }
    .ruler { height:21px; flex:none; position:relative; display:flex; padding-left:84px; padding-right:11px; color:#493d2b; font:10px Consolas,monospace; border-bottom:2px solid #69573d; }
    .ruler .tick { position:relative; flex:1; min-width:0; font-size:0; }
    .ruler .tick:last-child { flex:0; }
    .ruler .tick::after { content:""; position:absolute; left:0; bottom:0; height:5px; width:1px; background:#9c896d; }
    .ruler .tick.second::after { height:6px; background:#667778; }
    .ruler .tick.mid::after { height:8px; background:#3d5d60; }
    .ruler .tick.major::after { height:10px; background:#16353a; }
    .ruler .tick em { position:absolute; left:0; top:-2px; transform:translateX(-50%); font:var(--type-caption)/var(--type-caption) Consolas,monospace; font-style:normal; white-space:nowrap; }
    .track-screen { flex:1; min-height:0; position:relative; padding:4px 9px; border:2px solid #303a3c; background:var(--screen); box-shadow:inset 0 0 10px #000,inset 0 0 0 1px #6c756d; }
    .track-row { height:20px; display:flex; align-items:center; position:relative; }
    .track-row + .track-row { margin-top:4px; }
    .track-label { width:73px; flex:none; color:var(--amber-dim); font:var(--type-caption) Consolas,monospace; letter-spacing:.04em; }
    .track-lane { display:flex; align-items:stretch; position:relative; flex:1; height:18px; border:1px solid #36717b; }
    .scene-segment { display:flex; align-items:center; justify-content:center; border-right:1px solid #091a1f; background:#164951; color:var(--amber-hi); font-size:var(--type-control); font-weight:700; }
    .scene-segment:nth-child(2) { background:#15525b; }
    .scene-segment:nth-child(3) { background:#1b4650; }
    .scene-segment:last-child { border-right:0; }
    .track-row.context { --track-ink:var(--ink-cut); }
    .track-row.context.compose { --track-ink:var(--ink-source); }
    .track-row.context.sample { --track-ink:var(--ink-sample); }
    .track-row.context .track-lane { height:16px; border:0; overflow:visible; }
    .context-segment { position:relative; box-sizing:border-box; flex:none; height:16px; min-width:0; padding-right:3px; cursor:crosshair; }
    .context-segment::before { content:""; position:absolute; top:0; left:0; right:3px; height:8px; border-radius:5px; background:var(--track-ink); }
    .context-segment.timed::after { content:""; position:absolute; top:11px; left:0; right:3px; height:4px; border-radius:3px; background:var(--ink-time); }
    .context-segment.linear { display:flex; align-items:flex-start; overflow:hidden; }
    .context-segment.linear .halftone-cell { position:relative; top:11px; height:4px; min-width:0; flex:1; background-image:radial-gradient(circle,var(--ink-time) var(--dot),transparent calc(var(--dot) + .2px)); background-size:5px 5px; background-position:center; }
    .context-segment:last-child { padding-right:0; }
    .context-segment:last-child::before,.context-segment:last-child::after { right:0; }
    .playhead { position:absolute; top:0; bottom:0; width:2px; background:var(--cyan); box-shadow:0 0 5px var(--cyan); pointer-events:none; z-index:2; }
    .playhead::before { content:""; position:absolute; top:-5px; left:-4px; width:9px; height:6px; background:var(--cyan); }
    .resize-handle { width:7px; cursor:col-resize; position:absolute; top:128px; bottom:var(--timeline-h); z-index:7; }
    .resize-handle.left { left:calc(8px + var(--left-w, 270px) + 1px); }
    .resize-handle.right { right:calc(8px + var(--right-w, 348px) + 1px); }
    .resize-handle:hover { background:#ffe16b30; }
    .overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:#060807ba; }
    .temporary-panel { width:min(690px, calc(100vw - 80px)); min-height:245px; border:8px solid var(--casing); padding:5px; background:var(--casing); box-shadow:0 0 0 1px #f3faee,0 22px 70px #000e; animation:signal-open 310ms steps(5,end) both; }
    .temporary-panel .screen { min-height:230px; }
    .temporary-panel .panel-content { padding:15px 18px; animation:content-in 110ms ease 250ms both; }
    .temporary-panel .screen-head { height:37px; }
    .panel-intro { color:var(--muted); margin:0 0 18px; line-height:1.6; }
    .export-options { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .export-options button { border:1px solid var(--screen-line); background:#1b2428; color:var(--ink); min-height:72px; text-align:left; padding:10px; }
    .export-options button:hover { border-color:var(--amber); }
    .export-options button strong { display:block; color:var(--amber-hi); margin-bottom:7px; }
    .panel-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
    .screen-button { min-height:29px; border:1px solid #68726d; background:#212b2c; color:var(--amber-hi); padding:3px 12px; }
    .screen-button.primary { background:var(--ink-source); color:#102027; }
    @keyframes signal-open {
      0% { clip-path:inset(50% 49.8% 50% 49.8%); opacity:.3; }
      17% { clip-path:inset(12% 49.8% 12% 49.8%); opacity:1; }
      30% { clip-path:inset(12% 49.8% 12% 49.8%); opacity:.38; }
      44% { clip-path:inset(12% 49.8% 12% 49.8%); opacity:1; }
      100% { clip-path:inset(0); opacity:1; }
    }
    @keyframes content-in { from { opacity:0; } to { opacity:1; } }
    @media (max-width:1340px) { :root { --shell-gap:6px; } .bench { padding:6px; } .hardware-bay.tools .console-key { width:39px; flex-basis:39px; } .tool-middle { gap:5px; } .tool-readout { gap:7px; padding:0 7px; } .tool-readout .readout-pair input[type=number] { width:40px; } .resize-handle.left { left:calc(6px + var(--left-w, 270px) + 1px); } .resize-handle.right { right:calc(6px + var(--right-w, 348px) + 1px); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
  </style>
</head>

  <main class="bench" x-data="bench()" x-init="init()" :style="`--left-w:${leftWidth}px;--right-w:${rightWidth}px`" @keydown.escape.window="modal=''">
    <div class="command-deck">
      <div class="brand-plaque"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><strong>ToSampool</strong></div>
    </div>

    <div class="tool-deck">
      <div class="hardware-bay"><div class="bay-keys">
        <button class="console-key" title="新建场景" @click="modal='new'"><span class="key-cap"><svg class="ico"><use href="#i-new"/></svg></span><span class="key-label">新建场景</span></button>
        <button class="console-key" title="打开场景" @click="modal='open'"><span class="key-cap"><svg class="ico"><use href="#i-folder"/></svg></span><span class="key-label">打开场景</span></button>
        <button class="console-key" :class="{'selected':modal==='agent'}" title="Agent 创作" @click="modal='agent'"><span class="key-cap"><svg class="ico"><use href="#i-agent"/></svg></span><span class="key-label">Agent 创作</span></button>
      </div></div>
      <div class="hardware-bay tools"><div class="tool-middle">
        <div class="tool-bank" role="toolbar" aria-label="绘制工具"><template x-for="item in tools" :key="item.id">
          <button class="console-key" :class="{'selected':tool===item.id}" :title="item.name" :aria-label="item.name" :aria-pressed="tool===item.id" @click="tool=item.id"><span class="key-cap"><svg class="ico"><use :href="'#i-'+item.id"/></svg></span><span class="key-label" x-text="item.short || item.name"></span></button>
        </template></div>
        <div class="tool-readout" aria-live="polite">
          <strong x-text="toolName()"></strong>

            <div class="context-segment linear bridge" style="width:22%" title="Linear：时序 → 时序" @click="time=19"><template x-for="dot in [2,1.75,1.5,1.25,1,0.5,0,0,0.5,1,1.25,1.5,1.75,2]"><span class="halftone-cell" :style="`--dot:${dot}px`"></span></template></div>
            <div class="context-segment timed" style="width:16%" title="时序时段" @click="time=26"></div>
            <div class="context-segment linear exit" style="width:11%" title="Linear：时序 → 默认" @click="time=31"><template x-for="dot in [2,1.75,1.5,1.25,1,0.75,0.5,0.25,0]"><span class="halftone-cell" :style="`--dot:${dot}px`"></span></template></div>
            <div class="context-segment" style="width:8%" title="默认时段" @click="time=35"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="overlay" x-show="modal" x-cloak @click.self="null"><div class="temporary-panel" role="dialog" aria-modal="true" aria-label="临时工作面板"><div class="screen pane-screen"><header class="screen-head"><span class="head-title"><i class="head-line"></i><span x-text="modalTitle()"></span></span><button class="screen-button" @click="modal=''" aria-label="关闭面板">×</button></header><div class="panel-content"><p class="panel-intro" x-text="modal==='export'?'选择本次要输出的格式。':modal==='agent'?'描述想让 Agent 创作或修改的画面。':'选择要载入的文件。'"></p><div class="export-options" x-show="modal==='export'"><button><strong>PNG</strong>当前帧图像</button><button><strong>SPRITE</strong>逐帧精灵图</button><button><strong>GIF</strong>循环动画</button></div><div x-show="modal!=='export'"><label class="param-row"><span x-text="modal==='agent'?'创作意图':'项目文件'"></span><input type="text" :placeholder="modal==='agent'?'例如：木屋窗内的光缓慢闪烁':'选择文件…'"></label></div><div class="panel-actions"><button class="screen-button" @click="modal=''">取消</button><button class="screen-button primary" @click="modal=''" x-text="modal==='export'?'继续导出':'继续'"></button></div></div></div></div></div>
  </main>
  <script>
    function installScreenScrollRails(){
      const host=document.querySelector('.bench');
      if(!host)return;
      const selector='.tree-scroll, .lower-scroll, .inspector-scroll';
      const rails=new Map();
      let frame=0;
      const measure=()=>{
        frame=0;
        rails.forEach(({rail,thumb},node)=>{
          if(node.offsetParent===null)return;
          const view=node.clientHeight,content=node.scrollHeight,scrollMax=Math.max(0,content-view);
          const thumbHeight=scrollMax?Math.min(view,Math.max(20,view*view/content)):view;
          const thumbTop=scrollMax?(node.scrollTop/scrollMax)*(view-thumbHeight):0;
          rail.style.height=view+'px';
          rail.style.transform=`translateY(${node.scrollTop}px)`;
          thumb.style.height=thumbHeight+'px';
          thumb.style.top=thumbTop+'px';
          rail.dataset.overflow=String(scrollMax>1);
        });
      };
      const schedule=()=>{if(!frame)frame=requestAnimationFrame(measure);};
      const resize=new ResizeObserver(schedule);
      host.querySelectorAll(selector).forEach(node=>{
        const contentChildren=Array.from(node.children);
        const rail=document.createElement('div'),thumb=document.createElement('div');
        rail.className='screen-scroll-rail';rail.setAttribute('aria-hidden','true');
        thumb.className='screen-scroll-thumb';rail.appendChild(thumb);node.appendChild(rail);
        if(!node.hasAttribute('tabindex'))node.tabIndex=0;
        rails.set(node,{rail,thumb});
        resize.observe(node);contentChildren.forEach(child=>resize.observe(child));
        node.addEventListener('scroll',schedule,{passive:true});
        rail.addEventListener('pointerdown',event=>{
          if(event.button!==0||node.scrollHeight<=node.clientHeight+1)return;
          event.preventDefault();event.stopPropagation();
          const thumbRect=thumb.getBoundingClientRect();
          const inThumb=event.clientY>=thumbRect.top&&event.clientY<=thumbRect.bottom;
          const grabOffset=inThumb?event.clientY-thumbRect.top:thumbRect.height/2;
          const setPosition=clientY=>{
            const rect=rail.getBoundingClientRect(),travel=rect.height-thumbRect.height;
            if(travel<=0)return;
            node.scrollTop=Math.max(0,Math.min(1,(clientY-rect.top-grabOffset)/travel))*(node.scrollHeight-node.clientHeight);
          };
          if(!inThumb)setPosition(event.clientY);
          rail.setPointerCapture(event.pointerId);
          const move=next=>{if(rail.hasPointerCapture(next.pointerId))setPosition(next.clientY);};
          const stop=()=>{rail.removeEventListener('pointermove',move);rail.removeEventListener('pointerup',stop);rail.removeEventListener('pointercancel',stop);};
          rail.addEventListener('pointermove',move);rail.addEventListener('pointerup',stop,{once:true});rail.addEventListener('pointercancel',stop,{once:true});
        });
      });
      new MutationObserver(records=>{if(records.some(record=>!record.target.closest('.screen-scroll-rail')))schedule();}).observe(host,{subtree:true,attributes:true,childList:true,attributeFilter:['class','style','hidden']});
      window.addEventListener('resize',schedule);
      schedule();
    }
    window.addEventListener('DOMContentLoaded',installScreenScrollRails);
    function bench(){let activeViewTransition=null;return {
      leftWidth:270,rightWidth:348,tool:'rect',toolSettings:{fill:'#eeae42',radius:8,stroke:2,sides:5,fontSize:16,penSize:1},sideTab:'effects',inspectorTab:'decor',selectedEffect:'outline',selectedNode:'cabin',modal:'',flash:'',playing:true,time:16.8,previewMode:'Auto',autoFallsBack:false,p95Ms:3.0,treeOpen:true,elementOpen:true,baseTiming:false,dynamicTiming:false,effectTiming:false,
      formationPage:'basic',selectedMotion:'bob',motionTiming:{},activeMotions:{bob:false,scroll:false,pulse:false,spin:false,wave:false,blink:false},motionEffects:[{id:'bob',name:'漂浮',glyph:'↕'},{id:'scroll',name:'循环滚动',glyph:'⇢'},{id:'pulse',name:'呼吸缩放',glyph:'◎'},{id:'spin',name:'持续旋转',glyph:'⟳'},{id:'wave',name:'摆动',glyph:'⌁'},{id:'blink',name:'闪烁',glyph:'◐'}],
      dynamic:{position:false,scale:false,rotation:false,alpha:false},
      activeEffects:{outline:true,texture:true,halftone:true,mask:true},
      removedEffects:{outline:false,texture:false,halftone:false,mask:false},
      tools:[{id:'select',name:'选择'},{id:'rect',name:'矩形'},{id:'line',name:'直线'},{id:'ellipse',name:'椭圆'},{id:'poly',name:'多边形'},{id:'pen',name:'像素铅笔',short:'铅笔'},{id:'text',name:'位图文字',short:'文字'},{id:'image',name:'图片'}],
      decorEffects:[{id:'projection',name:'投影',glyph:'▨',description:'沿对象轮廓生成硬边投影。'},{id:'outline',name:'描边',glyph:'D',description:'沿对象最终轮廓向外生成描边。'},{id:'tint',name:'染色叠加',glyph:'◫',description:'给对象加入统一颜色。'},{id:'texture',name:'纹理叠加',glyph:'≋',description:'将图案叠在对象内部。'},{id:'inner',name:'内光效',glyph:'◉',description:'从内部边缘向中心退晕。'},{id:'outer',name:'外光效',glyph:'◌',description:'从外部轮廓向外退晕。'}],
      sampleEffects:[{id:'color-map',name:'颜色映射',glyph:'◧',description:'提取或指定有限颜色。'},{id:'threshold',name:'阈值分色',glyph:'◩',description:'将明暗压成两色。'},{id:'dispersion',name:'边缘色散',glyph:'D',description:'在边缘分离彩色通道。'},{id:'offset',name:'偏移采样',glyph:'▤',description:'让像素产生局部位移。'},{id:'halftone',name:'网点映射',glyph:'◉',description:'将明暗印成彩色网点。'},{id:'uneven',name:'不均采样',glyph:'▦',description:'生成粗细不均的采样颗粒。'}],
      init(){const state=new URLSearchParams(location.search).get('state');if(state==='compose')this.inspectorTab='compose';if(state==='sample'){this.inspectorTab='sample';this.selectedEffect='halftone';}if(state==='assets')this.sideTab='assets';if(state==='modal')this.modal='export';if(state==='group')this.selectedNode='snowglobe';if(state==='primitive')this.selectedNode='roof';if(state==='timed'){this.inspectorTab='compose';this.formationPage='motion';this.activeMotions.bob=true;this.motionTiming.bob=true;}if(state==='auto-draft'){this.autoFallsBack=true;this.p95Ms=26.0;}},
      effectivePreview(){return this.previewMode==='Auto'?(this.autoFallsBack?'Draft':'Full'):this.previewMode;},
      toolName(){return this.tools.find(item=>item.id===this.tool)?.name||'选择';},
      selectedNodeName(){return {snowglobe:'雪花球',glass:'玻璃罩',cabin:'冬季 · 木屋',roof:'屋顶',window:'窗光',snow:'飘雪',plain:'背景雪原'}[this.selectedNode]||'雪花球';},
      visibleEffects(){return this.inspectorTab==='sample'?this.sampleEffects:this.decorEffects;},
      effectName(id){return [...this.decorEffects,...this.sampleEffects].find(item=>item.id===id)?.name||'';},
      effectDescription(id){return [...this.decorEffects,...this.sampleEffects].find(item=>item.id===id)?.description||'';},
      transitionScreen(scope,change){
        if(activeViewTransition)activeViewTransition.skipTransition();
        if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches){change();return;}
        const host=document.querySelector('.bench');
        host.dataset.transitionScope=scope;
        const transition=document.startViewTransition(async()=>{change();await this.$nextTick();});
        activeViewTransition=transition;
        const clear=()=>{if(activeViewTransition===transition){activeViewTransition=null;delete host.dataset.transitionScope;}};
        transition.finished.then(clear,clear);
      },
      switchSide(tab){if(this.sideTab===tab)return;this.transitionScreen('side',()=>{this.sideTab=tab;});},
      switchFormation(){this.transitionScreen('inspector',()=>{this.formationPage=this.formationPage==='basic'?'motion':'basic';});},
      setInspector(tab){if(this.inspectorTab===tab)return;this.transitionScreen('inspector',()=>{this.inspectorTab=tab;if(tab!=='compose')this.selectedEffect=tab==='sample'?'halftone':'outline';});},
      toggleEffect(id){this.activeEffects[id]=!this.activeEffects[id];if(this.activeEffects[id]&&id in this.removedEffects)this.removedEffects[id]=false;},
      removeSelectedEffect(){const id=this.selectedEffect;if(!(id in this.removedEffects))return;this.removedEffects[id]=true;this.activeEffects[id]=false;this.selectedEffect='compose';this.inspectorTab='compose';},
      hasDynamic(){return Object.values(this.dynamic).some(Boolean);},
      modalTitle(){return {export:'导出其他格式',agent:'Agent 创作',new:'新建场景',open:'打开场景'}[this.modal]||'面板';},
      startResize(which,event){event.preventDefault();const startX=event.clientX,initial=which==='left'?this.leftWidth:this.rightWidth;const move=next=>{const delta=next.clientX-startX;if(which==='left')this.leftWidth=Math.min(340,Math.max(232,initial+delta));else this.rightWidth=Math.min(430,Math.max(308,initial-delta));};const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop);};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop);}
    };}
  </script>
