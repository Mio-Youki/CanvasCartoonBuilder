/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

-dial::before{background:var(--accent)}\n.dial-tick{position:absolute;inset:0;pointer-events:none;transform:rotate(var(--tick-angle))}\n.dial-tick::before{content:\"\";position:absolute;left:calc(50% - .5px);top:1px;width:1px;height:6px;background:var(--accent);opacity:.9}\n.select-shell{position:relative;display:block;min-width:0;width:100%}\n.select-shell select{display:block;width:100%;appearance:none;text-align:left;padding-left:25px;padding-right:7px}\n.select-arrow{position:absolute;z-index:1;left:8px;top:50%;transform:translateY(-50%);font:700 14px Consolas,monospace;color:var(--accent);pointer-events:none}\n.select-shell.open .select-arrow{font-size:17px;top:42%}\n.specimen .segments button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n.toggle-row{justify-content:flex-start;gap:12px}\n.toggle-row .switch{order:0;position:relative;flex:none}\n.toggle-row .toggle-name{order:1}\n.toggle-row.enabled .toggle-name{color:var(--accent);font-weight:700}\n.toggle-row .switch[aria-checked=true]{background:color-mix(in srgb,var(--accent) 37%,var(--screen));border-color:var(--accent)}\n.toggle-row .switch[aria-checked=true] i{background:var(--accent)}\n.toggle-row .switch[aria-checked=true]::before{content:\"\";position:absolute;left:7px;top:6px;width:6px;height:6px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}\n.ref-thumb{position:relative;width:20px;height:20px;flex:none;border:1px solid currentColor;background:transparent!important;color:var(--accent);font-size:0!important}\n.ref-thumb::before{content:\"\";position:absolute;inset:4px;background:currentColor}\n.ref-menu button[data-ref=\"前景松林\"] .ref-thumb{color:var(--stage-decor,#e87569)}\n.ref-menu button[data-ref=\"玻璃罩组\"] .ref-thumb{color:var(--stage-sample,#efc266)}\n.field-vertical{display:flex;flex-direction:column;align-items:stretch!important;gap:6px}\n.field-vertical>span:first-child{padding-top:0!important}\n.field-vertical textarea{width:100%;min-height:86px}\n.pattern-preview{margin-top:0;margin-bottom:6px}\n.pattern-controls{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;margin-bottom:7px}\n.pattern-controls .field{grid-template-columns:85px minmax(0,1fr)}\n.pattern-color{position:static;right:auto;bottom:auto;min-height:29px;padding:3px 5px;width:100%;justify-content:flex-start;background:transparent}\n.pattern-color-field .pattern-color .swatch{width:25px;height:21px}\n.pattern-color-field .pattern-color{border-color:var(--screen-line)}\n.specimen .icon-key[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n\n/* Three genuinely different control grammars over the same value contract. */\n.print-manual .specimen .num:hover,.print-manual .specimen .num:focus{border-color:transparent;border-bottom:2px solid var(--accent);background:#fff8e6}\n.print-manual .specimen .select-shell select{border:0;border-bottom:2px solid #465e5b;background:transparent;color:#183338}\n.print-manual .specimen .select-arrow{left:3px}\n.print-manual .specimen .segments{gap:0;border:1px solid #314f50}\n.print-manual .specimen .segments button{border:0;border-right:1px solid #314f50;background:transparent;color:#1b3437}\n.print-manual .specimen .segments button:last-child{border-right:0}\n.print-manual .specimen .segments button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}\n.print-manual .specimen .switch{border:1px solid #375b59;background:#d0d4c4}\n.print-manual .specimen .switch i{background:#4b6966}\n.print-manual .specimen .pattern-color{background:transparent;color:#183338}\n\n.overprint-poster .specimen .range-ends{font-weight:700;color:var(--accent)}\n.overprint-poster .specimen .percent-input{background:#263439;box-shadow:inset 3px 0 var(--accent)}\n.overprint-poster .specimen .select-shell select{border:2px solid #8a9e96;background:#223137;font-weight:700}\n.overprint-poster .specimen .select-arrow{left:7px;font-size:17px}\n.overprint-poster .specimen .segments button{border-width:2px;font-weight:800}\n.overprint-poster .specimen .switch{border:2px solid var(--accent);background:#28383b}\n.overprint-poster .specimen .switch[aria-checked=true]::before{font-weight:900}\n.overprint-poster .specimen .angle-dial{box-shadow:inset 0 0 0 4px #344448,0 0 0 2px var(--accent)}\n.overprint-poster .specimen .pattern-color{border-width:2px}\n\n.signal-instrument .specimen .num:hover,.signal-instrument .specimen .num:focus{border-color:var(--accent);background:#163b40}\n.signal-instrument .specimen .select-shell select{border:0;border-bottom:1px dashed var(--accent);background:transparent;color:#e7edcd}\n.signal-instrument .specimen .select-arrow{left:1px}\n.signal-instrument .specimen .segments{gap:3px}\n.signal-instrument .specimen .segments button{border:1px dashed #608f8d;background:#0b242a}\n.signal-instrument .specimen .segments button[aria-pressed=true]{border-style:solid}\n.signal-instrument .specimen .switch{border:1px dashed var(--accent);background:#103238}\n.signal-instrument .specimen .pattern-color{border-style:dashed}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003cheader class=\"mast\">\u003cdiv class=\"brand\">\u003ci aria-hidden=\"true\">\u003c/i>ToSampool\u003c/div>\u003cdiv class=\"mast-title\">Inspector · 输入组件\u003c/div>\u003cdiv class=\"mast-meta\">\u003cspan class=\"lamp\" aria-hidden=\"true\">\u003c/span>11 CONTROL TYPES\u003c/div>\u003c/header>\n  \u003cdiv class=\"intro\">\u003cdiv>\u003ch1>输入样式\u003c/h1>\u003cp>同一套数显语法，分别服务精确输入、快速试探与画布直接编辑。\u003c/p>\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003cb>\u003c/b>读数\u003c/span>\u003cspan>\u003cb class=\"l2\">\u003c/b>当前选择\u003c/span>\u003cspan>\u003cb class=\"l3\">\u003c/b>空间目标\u003c/span>\u003c/div>\u003c/div>\n  \u003cmain class=\"grid\">\n    \u003carticle class=\"specimen\" id=\"scalar\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">01\u003c/span>\u003ch2>精确数值\u003c/h2>\u003csmall>SCALAR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>画布尺寸\u003c/span>\u003cspan>INTEGER / PX\u003c/span>\u003c/div>\u003clabel class=\"field\">\u003cspan>宽度\u003c/span>\u003cspan class=\"unit-input\">\u003cinput class=\"num\" id=\"scalarValue\" type=\"number\" min=\"1\" step=\"1\" value=\"1920\">\u003cem>px\u003c/em>\u003c/span>\u003c/label>\u003cp class=\"note\">单击键入；按住数值上下拖动可增减。尺寸、帧序号和随机种子无需加减按钮。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / WIDTH\u003c/span>\u003cstrong id=\"scalarOut\">1920 PX\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"range\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">02\u003c/span>\u003ch2>滑杆＋数值\u003c/h2>\u003csmall>RANGE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>不均采样\u003c/span>\u003cspan>LIVE\u003c/span>\u003c/div>\u003clabel class=\"field\">\u003cspan>粗细幅度\u003c/span>\u003cspan class=\"range-line\">\u003cinput id=\"rangeSlider\" type=\"range\" min=\"0\" max=\"100\" value=\"38\">\u003cinput class=\"num\" id=\"rangeValue\" type=\"number\" min=\"0\" max=\"100\" value=\"38\" aria-label=\"粗细幅度百分比\">\u003c/span>\u003c/label>\u003cp class=\"note\">拖动先看视觉变化，数值框负责精确落点；实际复杂效果可在拖动时使用 Draft 预算。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / AMOUNT\u003c/span>\u003cstrong id=\"rangeOut\">38%\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"pair\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">03\u003c/span>\u003ch2>成对数值\u003c/h2>\u003csmall>PAIR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>位置与大小\u003c/span>\u003cspan>X / Y · W / H\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>坐标\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>X\u003cinput class=\"num\" id=\"pairX\" type=\"number\" step=\"1\" value=\"273\">\u003c/label>\u003clabel>Y\u003cinput class=\"num\" id=\"pairY\" type=\"number\" step=\"1\" value=\"181\">\u003c/label>\u003c/div>\u003cspan class=\"pair-slot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003cspan>宽 / 高\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>W\u003cinput class=\"num\" id=\"pairW\" type=\"number\" min=\"1\" step=\"1\" value=\"640\">\u003c/label>\u003clabel>H\u003cinput class=\"num\" id=\"pairH\" type=\"number\" min=\"1\" step=\"1\" value=\"360\">\u003c/label>\u003c/div>\u003cbutton class=\"icon-key\" id=\"ratioLock\" type=\"button\" aria-label=\"锁定宽高比例\" aria-pressed=\"false\" title=\"锁定宽高比例\">\u003csvg class=\"ratio-icon\" viewBox=\"0 0 12 22\" aria-hidden=\"true\">\u003cg class=\"unlinked\">\u003cpath d=\"M5 1.5c-1.4 0-2 1-2 2.3v3.4C3 8 3.6 9 5 9s2-1 2-2.3V3.8c0-1.3-.6-2.3-2-2.3Z\"/>\u003cpath d=\"M7 13c-1.4 0-2 1-2 2.3v3.4C5 20 5.6 21 7 21s2-1 2-2.3v-3.4C9 14 8.4 13 7 13Z\"/>\u003c/g>\u003cg class=\"linked\">\u003cpath d=\"M5 1.5c-1.4 0-2 1-2 2.3v4C3 9 3.6 10 5 10s2-1 2-2.7V3.8c0-1.3-.6-2.3-2-2.3Z\"/>\u003cpath d=\"M7 12c-1.4 0-2 1-2 2.3v4.4C5 20 5.6 21 7 21s2-1 2-2.3v-4.4C9 13 8.4 12 7 12Z\"/>\u003cpath d=\"M6 7.5v7\"/>\u003c/g>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"note\">锁定后调整宽或高，另一项按原比例同步。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / POSITION\u003c/span>\u003cstrong id=\"pairOut\">273, 181 · 640×360\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"angle\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">04\u003c/span>\u003ch2>角度／方向\u003c/h2>\u003csmall>ANGLE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>扫描擦除\u003c/span>\u003cspan>CONTINUOUS\u003c/span>\u003c/div>\u003cdiv class=\"angle-layout\">\u003cspan>方向\u003c/span>\u003cdiv class=\"angle-dial\" id=\"angleDial\" role=\"slider\" tabindex=\"0\" aria-label=\"扫描擦除方向\" aria-valuemin=\"-180\" aria-valuemax=\"180\" aria-valuenow=\"24\">\u003c/div>\u003cspan class=\"unit-input\">\u003cinput class=\"num\" id=\"angleValue\" type=\"number\" min=\"-180\" max=\"180\" step=\"1\" value=\"24\" aria-label=\"扫描擦除方向角度\">\u003cem>°\u003c/em>\u003c/span>\u003c/div>\u003cp class=\"note\">方向盘可拖动，数值可直接键入或上下拖动；扫描方向不再限于四个方向。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / DIRECTION\u003c/span>\u003cstrong id=\"angleOut\">24°\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"choice\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">05\u003c/span>\u003ch2>枚举选择\u003c/h2>\u003csmall>CHOICE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>过渡\u003c/span>\u003cspan>ONE OF N\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>方式\u003c/span>\u003cdiv class=\"segments\" role=\"group\" aria-label=\"过渡方式\">\u003cbutton data-choice=\"扫描擦除\" aria-pressed=\"true\">扫描擦除\u003c/button>\u003cbutton data-choice=\"溶解\" aria-pressed=\"false\">溶解\u003c/button>\u003cbutton data-choice=\"淡入淡出\" aria-pressed=\"false\">淡入淡出\u003c/button>\u003c/div>\u003c/div>\u003clabel class=\"field\">\u003cspan>叠加方式\u003c/span>\u003cselect id=\"choiceSelect\">\u003coption>正常\u003c/option>\u003coption>滤色\u003c/option>\u003coption>正片叠底\u003c/option>\u003coption>加亮\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / MODE\u003c/span>\u003cstrong id=\"choiceOut\">扫描擦除 · 正常\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"toggle\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">06\u003c/span>\u003ch2>双态开关\u003c/h2>\u003csmall>TOGGLE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>网点映射\u003c/span>\u003cspan>PROGRESSIVE\u003c/span>\u003c/div>\u003cdiv class=\"toggle-row\">\u003cspan>双色\u003c/span>\u003cbutton class=\"switch\" id=\"duotoneSwitch\" type=\"button\" role=\"switch\" aria-checked=\"false\" aria-label=\"启用双色\">\u003ci>\u003c/i>\u003c/button>\u003c/div>\u003cdiv class=\"dependent\" id=\"duotoneFields\" hidden>\u003cdiv class=\"field\">\u003cspan>暗色 / 亮色\u003c/span>\u003cdiv class=\"field-stack\">\u003cspan class=\"swatch\" style=\"background:#1b2e3a\">\u003cinput type=\"color\" value=\"#1b2e3a\" aria-label=\"暗色\">\u003c/span>\u003cspan class=\"swatch\" style=\"background:#ead6a8\">\u003cinput type=\"color\" value=\"#ead6a8\" aria-label=\"亮色\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"note\">打开后显示从属参数；浮标留下向下箭头，提示当前参数已展开。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / DUOTONE\u003c/span>\u003cstrong id=\"toggleOut\">OFF\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"color\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">07\u003c/span>\u003ch2>颜色＋透明度\u003c/h2>\u003csmall>COLOR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>染色叠加\u003c/span>\u003cspan>COLOR / ALPHA\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>颜色\u003c/span>\u003cdiv class=\"color-row\">\u003cspan class=\"checker\" id=\"colorSwatch\">\u003cinput id=\"colorValue\" type=\"color\" value=\"#c95a54\" aria-label=\"染色颜色\">\u003c/span>\u003cinput class=\"text-input mono\" id=\"colorHex\" type=\"text\" value=\"#C95A54\" maxlength=\"7\" aria-label=\"十六进制颜色\">\u003cinput class=\"num\" id=\"alphaValue\" type=\"number\" min=\"0\" max=\"100\" value=\"64\" aria-label=\"颜色透明度百分比\">\u003cspan class=\"percent\">%\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"note\">色块直接预览透明方格上的合成结果；色号与透明度同行，不再额外占一行预览。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / COLOR\u003c/span>\u003cstrong id=\"colorOut\">#C95A54 / 64%\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"reference\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">08\u003c/span>\u003ch2>素材／对象引用\u003c/h2>\u003csmall>REFERENCE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>蒙版来源\u003c/span>\u003cspan>OBJECT\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>引用对象\u003c/span>\u003cdiv class=\"ref-wrap\">\u003cbutton class=\"ref-button\" id=\"refButton\" type=\"button\" aria-expanded=\"false\" aria-controls=\"refMenu\">\u003cspan class=\"ref-thumb\">▤\u003c/span>\u003cspan class=\"ref-name\" id=\"refName\">冬季 · 木屋\u003c/span>\u003cspan>▾\u003c/span>\u003c/button>\u003cdiv class=\"ref-menu\" id=\"refMenu\" hidden>\u003cbutton type=\"button\" data-ref=\"冬季 · 木屋\" data-glyph=\"▤\">\u003cspan class=\"ref-thumb\">▤\u003c/span>冬季 · 木屋\u003c/button>\u003cbutton type=\"button\" data-ref=\"前景松林\" data-glyph=\"♠\">\u003cspan class=\"ref-thumb\">♠\u003c/span>前景松林\u003c/button>\u003cbutton type=\"button\" data-ref=\"玻璃罩组\" data-glyph=\"◯\">\u003cspan class=\"ref-thumb\">◯\u003c/span>玻璃罩组\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"note\">引用显示用户可辨认的名称，不能只露出内部 ID；后续可加缩略图与失联状态。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / TARGET\u003c/span>\u003cstrong id=\"refOut\">冬季 · 木屋\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"text\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">09\u003c/span>\u003ch2>文本\u003c/h2>\u003csmall>TEXT\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>位图文字\u003c/span>\u003cspan>MULTILINE\u003c/span>\u003c/div>\u003cdiv class=\"field\" style=\"align-items:start\">\u003cspan style=\"padding-top:5px\">内容\u003c/span>\u003ctextarea id=\"textValue\" rows=\"3\">下一站，秋天。\u003c/textarea>\u003c/div>\u003cp class=\"note\">短名称保持单行，作品文字允许多行与明确的编辑区域。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / CHARACTERS\u003c/span>\u003cstrong id=\"textOut\">8\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"spatial\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">10\u003c/span>\u003ch2>画布空间编辑\u003c/h2>\u003csmall>SPATIAL\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>旋转中心\u003c/span>\u003cspan>CANVAS TARGET\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>中心\u003c/span>\u003cdiv class=\"spatial-actions\">\u003cbutton class=\"set-center\" id=\"setCenter\" type=\"button\">设置中心\u003c/button>\u003cbutton class=\"reset-center\" id=\"resetCenter\" type=\"button\" aria-label=\"还原到中心\" title=\"还原到中心\">⌖\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"note\">进入设置状态后在正式画布取点；这里仅演示入口和复位状态，不另设坐标框。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / PIVOT\u003c/span>\u003cstrong id=\"spatialOut\">默认中心\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"pattern\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">11\u003c/span>\u003ch2>图样预览编辑\u003c/h2>\u003csmall>PATTERN\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>纹理叠加\u003c/span>\u003cspan>PREVIEW\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>图样类型\u003c/span>\u003cselect id=\"patternType\">\u003coption value=\"line\">单线\u003c/option>\u003coption value=\"grid\">网格\u003c/option>\u003coption value=\"dots\">点阵\u003c/option>\u003coption value=\"noise\">屏幕噪点\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"pattern-preview\" id=\"patternPreview\">\u003cspan class=\"pattern-color\">\u003cspan class=\"swatch\" id=\"patternSwatch\" style=\"background:#e5b85b\">\u003cinput id=\"patternColor\" type=\"color\" value=\"#e5b85b\" aria-label=\"图样颜色\">\u003c/span>\u003cspan id=\"patternHex\">#E5B85B\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"field compact\">\u003cspan>格距\u003c/span>\u003cinput class=\"num\" id=\"patternSpacing\" type=\"number\" min=\"4\" max=\"22\" value=\"10\" aria-label=\"图样格距\">\u003c/div>\u003cdiv class=\"field compact pattern-pair\">\u003cspan>起始偏移\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>X\u003cinput class=\"num\" id=\"patternOffsetX\" type=\"number\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\">\u003c/label>\u003clabel>Y\u003cinput class=\"num\" id=\"patternOffsetY\" type=\"number\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\">\u003c/label>\u003c/div>\u003cspan class=\"pair-slot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / PATTERN\u003c/span>\u003cstrong id=\"patternOut\">单线 · 10 PX\u003c/strong>\u003c/div>\u003c/article>\n  \u003c/main>\n  \u003cfooter>ToSampool / Inspector Control Register \u003cspan class=\"mono\">· 11 INPUT TYPES · 01\u003c/span>\u003c/footer>\n\u003c/div>\n\u003cscript>\n  const $=id=>document.getElementById(id);\n  const clamp=(value,min,max)=>Math.max(min,Math.min(max,Number(value)||0));\n  const bind=(ids,fn)=>ids.forEach(id=>$(id).addEventListener('input',fn));\n  function scalar(){$('scalarOut').textContent=$('scalarValue').value+' PX';}\n  $('scalarValue').oninput=scalar;\n  function range(from){const value=clamp($(from).value,0,100);$('rangeSlider').value=value;$('rangeValue').value=value;$('rangeOut').textContent=value+'%';}\n  bind(['rangeSlider','rangeValue'],event=>range(event.target.id));\n  const updateSliderFill=()=>{$('rangeSlider').style.setProperty('--fill',$('rangeSlider').value+'%');};\n  bind(['rangeSlider','rangeValue'],updateSliderFill);updateSliderFill();\n  let ratio=640/360;\n  function pair(changed){\n    if($('ratioLock').getAttribute('aria-pressed')==='true'&&['pairW','pairH'].includes(changed)){\n      if(changed==='pairW')$('pairH').value=Math.max(1,Math.round(Number($('pairW').value||1)/ratio));\n      else $('pairW').value=Math.max(1,Math.round(Number($('pairH').value||1)*ratio));\n    }\n    $('pairOut').textContent=($('pairX').value||0)+', '+($('pairY').value||0)+' · '+($('pairW').value||0)+'×'+($('pairH').value||0);\n  }\n  bind(['pairX','pairY','pairW','pairH'],event=>pair(event.target.id));\n  $('ratioLock').onclick=()=>{const on=$('ratioLock').getAttribute('aria-pressed')!=='true';$('ratioLock').setAttribute('aria-pressed',String(on));$('ratioLock').setAttribute('aria-label',on?'解除宽高比例锁定':'锁定宽高比例');if(on)ratio=Math.max(1,Number($('pairW').value||1))/Math.max(1,Number($('pairH').value||1));};\n  function angle(value){value=Math.round(clamp(value,-180,180));$('angleValue').value=value;$('angleDial').style.setProperty('--angle',value+'deg');$('angleDial').setAttribute('aria-valuenow',value);$('angleOut').textContent=value+'°';}\n  $('angleValue').oninput=()=>angle($('angleValue').value);angle($('angleValue').value);\n  function angleAt(event){const rect=$('angleDial').getBoundingClientRect(),dx=event.clientX-(rect.left+rect.width/2),dy=event.clientY-(rect.top+rect.height/2);angle(Math.atan2(dx,-dy)*180/Math.PI);}\n  $('angleDial').onpointerdown=event=>{if(event.button!==0)return;$('angleDial').setPointerCapture(event.pointerId);angleAt(event);};\n  $('angleDial').onpointermove=event=>{if($('angleDial').hasPointerCapture(event.pointerId))angleAt(event);};\n  $('angleDial').onkeydown=event=>{if(event.key==='ArrowRight'||event.key==='ArrowUp'){event.preventDefault();angle(Number($('angleValue').value)+1);}if(event.key==='ArrowLeft'||event.key==='ArrowDown'){event.preventDefault();angle(Number($('angleValue').value)-1);}};\n  let direction='扫描擦除';function choice(){ $('choiceOut').textContent=direction+' · '+$('choiceSelect').value; }\n  document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{direction=button.dataset.choice;document.querySelectorAll('[data-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));choice();});$('choiceSelect').onchange=choice;\n  $('duotoneSwitch').onclick=()=>{const on=$('duotoneSwitch').getAttribute('aria-checked')!=='true';$('duotoneSwitch').setAttribute('aria-checked',String(on));$('duotoneFields').hidden=!on;$('toggleOut').textContent=on?'ON':'OFF';};\n  document.querySelectorAll('#duotoneFields input').forEach(input=>input.oninput=()=>{input.parentElement.style.background=input.value;});\n  function color(){const hex=/^#[0-9a-f]{6}$/i.test($('colorHex').value)?$('colorHex').value.toUpperCase():$('colorValue').value.toUpperCase(),alpha=clamp($('alphaValue').value,0,100);$('colorValue').value=hex;$('colorHex').value=hex;$('alphaValue').value=alpha;$('colorSwatch').style.setProperty('--preview-color',hex);$('colorSwatch').style.setProperty('--preview-alpha',alpha/100);$('colorOut').textContent=hex+' / '+alpha+'%';}\n  $('colorValue').oninput=()=>{$('colorHex').value=$('colorValue').value;color();};$('colorHex').onchange=color;$('alphaValue').oninput=color;color();\n  $('refButton').onclick=()=>{const open=$('refMenu').hidden;$('refMenu').hidden=!open;$('refButton').setAttribute('aria-expanded',String(open));};\n  document.querySelectorAll('[data-ref]').forEach(button=>button.onclick=()=>{$('refName').textContent=button.dataset.ref;$('refOut').textContent=button.dataset.ref;$('refButton').querySelector('.ref-thumb').textContent=button.dataset.glyph;$('refMenu').hidden=true;$('refButton').setAttribute('aria-expanded','false');});\n  document.addEventListener('click',event=>{if(!event.target.closest('.ref-wrap')){$('refMenu').hidden=true;$('refButton').setAttribute('aria-expanded','false');}});\n  $('textValue').oninput=()=>{$('textOut').textContent=Array.from($('textValue').value).length;};$('textValue').dispatchEvent(new Event('input'));\n  $('setCenter').onclick=()=>{$('setCenter').textContent='点击画布取点…';$('spatialOut').textContent='等待画布取点';};\n  $('resetCenter').onclick=()=>{$('setCenter').textContent='设置中心';$('spatialOut').textContent='默认中心';};\n  function pattern(){const gap=clamp($('patternSpacing').value,4,22),type=$('patternType').value,preview=$('patternPreview'),hex=$('patternColor').value,ox=clamp($('patternOffsetX').value,0,1),oy=clamp($('patternOffsetY').value,0,1);$('patternSpacing').value=gap;preview.style.setProperty('--pattern-color',hex);preview.style.backgroundPosition=`${Math.round(ox*gap)}px ${Math.round(oy*gap)}px`;const style={line:`repeating-linear-gradient(0deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px)`,grid:`repeating-linear-gradient(0deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px),repeating-linear-gradient(90deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px)`,dots:`radial-gradient(circle,${hex} 35%,transparent 40%)`,noise:`radial-gradient(circle,${hex} 20%,transparent 28%),radial-gradient(circle,#80cec3 12%,transparent 20%)`}[type];preview.style.backgroundImage=style;preview.style.backgroundSize=type==='dots'||type==='noise'?`${gap}px ${gap}px`:'auto';$('patternSwatch').style.background=hex;$('patternHex').textContent=hex.toUpperCase();$('patternOut').textContent=$('patternType').selectedOptions[0].text+' · '+gap+' PX';}\n  $('patternType').onchange=pattern;bind(['patternSpacing','patternOffsetX','patternOffsetY','patternColor'],pattern);pattern();\n  document.querySelectorAll('input.num').forEach(input=>{\n    input.addEventListener('pointerdown',event=>{\n      if(event.button!==0||event.ctrlKey||event.metaKey||event.altKey)return;\n      const startY=event.clientY,startValue=Number(input.value)||0,step=Number(input.step)>0?Number(input.step):1,min=input.min===''?-Infinity:Number(input.min),max=input.max===''?Infinity:Number(input.max),precision=(String(step).split('.')[1]||'').length;\n      let dragging=false;\n      const move=next=>{\n        const pixels=startY-next.clientY;\n        if(!dragging&&Math.abs(pixels)\u003c4)return;\n        if(!dragging){dragging=true;input.blur();document.body.style.userSelect='none';}\n        const nextValue=Math.max(min,Math.min(max,startValue+Math.trunc(pixels/5)*step));\n        input.value=nextValue.toFixed(Math.min(precision,3));input.dispatchEvent(new Event('input',{bubbles:true}));\n        next.preventDefault();\n      };\n      const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);document.body.style.userSelect='';};\n      window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',end,{once:true});\n    });\n  });\n\u003c/script>\n\u003cscript>// Shared component contract for the baseline and three visual directions.\n// Keep stored demo values numeric; percent signs are presentation only.\n(() => {\n  const $ = id => document.getElementById(id);\n  const stages = {\n    scalar:'compose', range:'sample', pair:'compose', angle:'sample',\n    choice:'sample', toggle:'sample', color:'decor', reference:'compose',\n    text:'compose', spatial:'compose', pattern:'decor'\n  };\n  Object.entries(stages).forEach(([id, stage]) => $(id)?.setAttribute('data-stage', stage));\n\n  document.querySelectorAll('.unit-input em').forEach(unit => {\n    if (unit.textContent.trim().toLowerCase() === 'px') unit.remove();\n  });\n  function percentField(input) {\n    if (!input || input.parentElement.classList.contains('percent-input')) return;\n    const wrap = document.createElement('span');\n    wrap.className = 'percent-input';\n    input.parentNode.insertBefore(wrap, input);\n    wrap.append(input);\n    const sign = document.createElement('span');\n    sign.className = 'percent-sign';\n    sign.textContent = '%';\n    sign.setAttribute('aria-hidden', 'true');\n    wrap.append(sign);\n  }\n  percentField($('rangeValue'));\n  percentField($('alphaValue'));\n  $('color')?.querySelector('.percent')?.remove();\n\n  const slider = $('rangeSlider');\n  const rangeLine = slider?.closest('.range-line');\n  if (rangeLine) {\n    const control = document.createElement('div');\n    control.className = 'range-control';\n    rangeLine.parentNode.insertBefore(control, rangeLine);\n    control.append(rangeLine);\n    const ends = document.createElement('div');\n    ends.className = 'range-ends';\n    ends.innerHTML = `\u003cspan>${slider.min || '0'}\u003c/span>\u003cspan>${slider.max || '100'}\u003c/span>`;\n    control.prepend(ends);\n  }\n\n  const dial = $('angleDial');\n  if (dial) {\n    const ring = document.createElement('span');\n    ring.className = 'dial-ring';\n    dial.parentNode.insertBefore(ring, dial);\n    ring.append(dial);\n    for (let n = 0; n \u003c 8; n++) {\n      const tick = document.createElement('i');\n      tick.className = 'dial-tick';\n      tick.style.setProperty('--tick-angle', `${n * 45}deg`);\n      tick.setAttribute('aria-hidden', 'true');\n      ring.append(tick);\n    }\n  }\n\n  document.querySelectorAll('.specimen select').forEach(select => {\n    const shell = document.createElement('span');\n    shell.className = 'select-shell';\n    select.parentNode.insertBefore(shell, select);\n    shell.append(select);\n    const arrow = document.createElement('span');\n    arrow.className = 'select-arrow';\n    arrow.textContent = '>';\n    arrow.setAttribute('aria-hidden', 'true');\n    shell.prepend(arrow);\n    const open = () => { shell.classList.add('open'); arrow.textContent = '⌄'; };\n    const close = () => { shell.classList.remove('open'); arrow.textContent = '>'; };\n    select.addEventListener('pointerdown', open);\n    select.addEventListener('keydown', event => { if (['Enter',' ','ArrowDown'].includes(event.key)) open(); });\n    select.addEventListener('change', close);\n    select.addEventListener('blur', close);\n  });\n\n  const switchRow = $('duotoneSwitch')?.closest('.toggle-row');\n  if (switchRow) {\n    const note = $('toggle')?.querySelector('.note');\n    if (note) note.textContent = '打开后显示从属参数；浮标留下向下箭头，提示当前参数已展开。';\n    const name = switchRow.querySelector('span');\n    name.classList.add('toggle-name');\n    switchRow.prepend($('duotoneSwitch'));\n    $('duotoneSwitch').addEventListener('click', () => {\n      switchRow.classList.toggle('enabled', $('duotoneSwitch').getAttribute('aria-checked') === 'true');\n    });\n  }\n\n  const textField = $('textValue')?.closest('.field');\n  textField?.classList.add('field-vertical');\n\n  const preview = $('patternPreview');\n  const patternTypeField = $('patternType')?.closest('.field');\n  const patternColor = preview?.querySelector('.pattern-color');\n  if (preview && patternTypeField && patternColor) {\n    const controls = document.createElement('div');\n    controls.className = 'pattern-controls';\n    preview.after(controls);\n    controls.append(patternTypeField);\n    const colorField = document.createElement('div');\n    colorField.className = 'field pattern-color-field';\n    colorField.innerHTML = '\u003cspan>颜色\u003c/span>';\n    colorField.append(patternColor);\n    controls.append(colorField);\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "inspector-input-lab.html", "baseline": true, "interactive": true}, {"id": "print-manual", "name": "A · 印刷说明书", "concept": "像一页可操作的设备说明书：暖纸、深墨、少量红色套印索引。", "typography": "高对比中文标题；Consolas 等宽数值；暖纸上的 13–16px 操作层级。", "palette": ["#f1e8d2", "#1b3033", "#bc5447"], "traits": ["浅底暖纸", "连排纸面枚举", "下划线数值与选择器"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>ToSampool · 输入组件 A / 印刷说明书\u003c/title>\n  \u003cstyle>\n    :root{\n      color-scheme:dark;\n      --shell:#cdbb98;--shell-hi:#eee0bf;--shell-edge:#67543a;\n      --screen:#0d1418;--screen-soft:#172125;--screen-line:#536168;\n      --ink:#eee9db;--muted:#aab8b9;--cyan:#84d7ce;--cyan-dark:#315a59;\n      --r ttom:7px}\n.pattern-controls .field{grid-template-columns:85px minmax(0,1fr)}\n.pattern-color{position:static;right:auto;bottom:auto;min-height:29px;padding:3px 5px;width:100%;justify-content:flex-start;background:transparent}\n.pattern-color-field .pattern-color .swatch{width:25px;height:21px}\n.pattern-color-field .pattern-color{border-color:var(--screen-line)}\n.specimen .icon-key[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n\n/* Three genuinely different control grammars over the same value contract. */\n.print-manual .specimen .num:hover,.print-manual .specimen .num:focus{border-color:transparent;border-bottom:2px solid var(--accent);background:#fff8e6}\n.print-manual .specimen .select-shell select{border:0;border-bottom:2px solid #465e5b;background:transparent;color:#183338}\n.print-manual .specimen .select-arrow{left:3px}\n.print-manual .specimen .segments{gap:0;border:1px solid #314f50}\n.print-manual .specimen .segments button{border:0;border-right:1px solid #314f50;background:transparent;color:#1b3437}\n.print-manual .specimen .segments button:last-child{border-right:0}\n.print-manual .specimen .segments button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}\n.print-manual .specimen .switch{border:1px solid #375b59;background:#d0d4c4}\n.print-manual .specimen .switch i{background:#4b6966}\n.print-manual .specimen .pattern-color{background:transparent;color:#183338}\n\n.overprint-poster .specimen .range-ends{font-weight:700;color:var(--accent)}\n.overprint-poster .specimen .percent-input{background:#263439;box-shadow:inset 3px 0 var(--accent)}\n.overprint-poster .specimen .select-shell select{border:2px solid #8a9e96;background:#223137;font-weight:700}\n.overprint-poster .specimen .select-arrow{left:7px;font-size:17px}\n.overprint-poster .specimen .segments button{border-width:2px;font-weight:800}\n.overprint-poster .specimen .switch{border:2px solid var(--accent);background:#28383b}\n.overprint-poster .specimen .switch[aria-checked=true]::before{font-weight:900}\n.overprint-poster .specimen .angle-dial{box-shadow:inset 0 0 0 4px #344448,0 0 0 2px var(--accent)}\n.overprint-poster .specimen .pattern-color{border-width:2px}\n\n.signal-instrument .specimen .num:hover,.signal-instrument .specimen .num:focus{border-color:var(--accent);background:#163b40}\n.signal-instrument .specimen .select-shell select{border:0;border-bottom:1px dashed var(--accent);background:transparent;color:#e7edcd}\n.signal-instrument .specimen .select-arrow{left:1px}\n.signal-instrument .specimen .segments{gap:3px}\n.signal-instrument .specimen .segments button{border:1px dashed #608f8d;background:#0b242a}\n.signal-instrument .specimen .segments button[aria-pressed=true]{border-style:solid}\n.signal-instrument .specimen .switch{border:1px dashed var(--accent);background:#103238}\n.signal-instrument .specimen .pattern-color{border-style:dashed}\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"print-manual\">\n\u003cdiv class=\"shell\">\n  \u003cheader class=\"mast\">\u003cdiv class=\"brand\">\u003ci aria-hidden=\"true\">\u003c/i>ToSampool\u003c/div>\u003cdiv class=\"mast-title\">Inspector · 输入组件\u003c/div>\u003cdiv class=\"mast-meta\">\u003cspan class=\"lamp\" aria-hidden=\"true\">\u003c/span>11 CONTROL TYPES\u003c/div>\u003c/header>\n  \u003cdiv class=\"intro\">\u003cdiv>\u003ch1>输入样式\u003c/h1>\u003cp>同一套数显语法，分别服务精确输入、快速试探与画布直接编辑。\u003c/p>\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003cb>\u003c/b>读数\u003c/span>\u003cspan>\u003cb class=\"l2\">\u003c/b>当前选择\u003c/span>\u003cspan>\u003cb class=\"l3\">\u003c/b>空间目标\u003c/span>\u003c/div>\u003c/div>\n  \u003cmain class=\"grid\">\n    \u003carticle class=\"specimen\" id=\"scalar\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">01\u003c/span>\u003ch2>精确数值\u003c/h2>\u003csmall>SCALAR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>画布尺寸\u003c/span>\u003cspan>INTEGER / PX\u003c/span>\u003c/div>\u003clabel class=\"field\">\u003cspan>宽度\u003c/span>\u003cspan class=\"unit-input\">\u003cinput class=\"num\" id=\"scalarValue\" type=\"number\" min=\"1\" step=\"1\" value=\"1920\">\u003cem>px\u003c/em>\u003c/span>\u003c/label>\u003cp class=\"note\">单击键入；按住数值上下拖动可增减。尺寸、帧序号和随机种子无需加减按钮。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / WIDTH\u003c/span>\u003cstrong id=\"scalarOut\">1920 PX\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"range\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">02\u003c/span>\u003ch2>滑杆＋数值\u003c/h2>\u003csmall>RANGE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>不均采样\u003c/span>\u003cspan>LIVE\u003c/span>\u003c/div>\u003clabel class=\"field\">\u003cspan>粗细幅度\u003c/span>\u003cspan class=\"range-line\">\u003cinput id=\"rangeSlider\" type=\"range\" min=\"0\" max=\"100\" value=\"38\">\u003cinput class=\"num\" id=\"rangeValue\" type=\"number\" min=\"0\" max=\"100\" value=\"38\" aria-label=\"粗细幅度百分比\">\u003c/span>\u003c/label>\u003cp class=\"note\">拖动先看视觉变化，数值框负责精确落点；实际复杂效果可在拖动时使用 Draft 预算。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / AMOUNT\u003c/span>\u003cstrong id=\"rangeOut\">38%\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"pair\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">03\u003c/span>\u003ch2>成对数值\u003c/h2>\u003csmall>PAIR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>位置与大小\u003c/span>\u003cspan>X / Y · W / H\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>坐标\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>X\u003cinput class=\"num\" id=\"pairX\" type=\"number\" step=\"1\" value=\"273\">\u003c/label>\u003clabel>Y\u003cinput class=\"num\" id=\"pairY\" type=\"number\" step=\"1\" value=\"181\">\u003c/label>\u003c/div>\u003cspan class=\"pair-slot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003cspan>宽 / 高\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>W\u003cinput class=\"num\" id=\"pairW\" type=\"number\" min=\"1\" step=\"1\" value=\"640\">\u003c/label>\u003clabel>H\u003cinput class=\"num\" id=\"pairH\" type=\"number\" min=\"1\" step=\"1\" value=\"360\">\u003c/label>\u003c/div>\u003cbutton class=\"icon-key\" id=\"ratioLock\" type=\"button\" aria-label=\"锁定宽高比例\" aria-pressed=\"false\" title=\"锁定宽高比例\">\u003csvg class=\"ratio-icon\" viewBox=\"0 0 12 22\" aria-hidden=\"true\">\u003cg class=\"unlinked\">\u003cpath d=\"M5 1.5c-1.4 0-2 1-2 2.3v3.4C3 8 3.6 9 5 9s2-1 2-2.3V3.8c0-1.3-.6-2.3-2-2.3Z\"/>\u003cpath d=\"M7 13c-1.4 0-2 1-2 2.3v3.4C5 20 5.6 21 7 21s2-1 2-2.3v-3.4C9 14 8.4 13 7 13Z\"/>\u003c/g>\u003cg class=\"linked\">\u003cpath d=\"M5 1.5c-1.4 0-2 1-2 2.3v4C3 9 3.6 10 5 10s2-1 2-2.7V3.8c0-1.3-.6-2.3-2-2.3Z\"/>\u003cpath d=\"M7 12c-1.4 0-2 1-2 2.3v4.4C5 20 5.6 21 7 21s2-1 2-2.3v-4.4C9 13 8.4 12 7 12Z\"/>\u003cpath d=\"M6 7.5v7\"/>\u003c/g>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"note\">锁定后调整宽或高，另一项按原比例同步。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / POSITION\u003c/span>\u003cstrong id=\"pairOut\">273, 181 · 640×360\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"angle\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">04\u003c/span>\u003ch2>角度／方向\u003c/h2>\u003csmall>ANGLE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>扫描擦除\u003c/span>\u003cspan>CONTINUOUS\u003c/span>\u003c/div>\u003cdiv class=\"angle-layout\">\u003cspan>方向\u003c/span>\u003cdiv class=\"angle-dial\" id=\"angleDial\" role=\"slider\" tabindex=\"0\" aria-label=\"扫描擦除方向\" aria-valuemin=\"-180\" aria-valuemax=\"180\" aria-valuenow=\"24\">\u003c/div>\u003cspan class=\"unit-input\">\u003cinput class=\"num\" id=\"angleValue\" type=\"number\" min=\"-180\" max=\"180\" step=\"1\" value=\"24\" aria-label=\"扫描擦除方向角度\">\u003cem>°\u003c/em>\u003c/span>\u003c/div>\u003cp class=\"note\">方向盘可拖动，数值可直接键入或上下拖动；扫描方向不再限于四个方向。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / DIRECTION\u003c/span>\u003cstrong id=\"angleOut\">24°\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"choice\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">05\u003c/span>\u003ch2>枚举选择\u003c/h2>\u003csmall>CHOICE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>过渡\u003c/span>\u003cspan>ONE OF N\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>方式\u003c/span>\u003cdiv class=\"segments\" role=\"group\" aria-label=\"过渡方式\">\u003cbutton data-choice=\"扫描擦除\" aria-pressed=\"true\">扫描擦除\u003c/button>\u003cbutton data-choice=\"溶解\" aria-pressed=\"false\">溶解\u003c/button>\u003cbutton data-choice=\"淡入淡出\" aria-pressed=\"false\">淡入淡出\u003c/button>\u003c/div>\u003c/div>\u003clabel class=\"field\">\u003cspan>叠加方式\u003c/span>\u003cselect id=\"choiceSelect\">\u003coption>正常\u003c/option>\u003coption>滤色\u003c/option>\u003coption>正片叠底\u003c/option>\u003coption>加亮\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / MODE\u003c/span>\u003cstrong id=\"choiceOut\">扫描擦除 · 正常\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"toggle\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">06\u003c/span>\u003ch2>双态开关\u003c/h2>\u003csmall>TOGGLE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>网点映射\u003c/span>\u003cspan>PROGRESSIVE\u003c/span>\u003c/div>\u003cdiv class=\"toggle-row\">\u003cspan>双色\u003c/span>\u003cbutton class=\"switch\" id=\"duotoneSwitch\" type=\"button\" role=\"switch\" aria-checked=\"false\" aria-label=\"启用双色\">\u003ci>\u003c/i>\u003c/button>\u003c/div>\u003cdiv class=\"dependent\" id=\"duotoneFields\" hidden>\u003cdiv class=\"field\">\u003cspan>暗色 / 亮色\u003c/span>\u003cdiv class=\"field-stack\">\u003cspan class=\"swatch\" style=\"background:#1b2e3a\">\u003cinput type=\"color\" value=\"#1b2e3a\" aria-label=\"暗色\">\u003c/span>\u003cspan class=\"swatch\" style=\"background:#ead6a8\">\u003cinput type=\"color\" value=\"#ead6a8\" aria-label=\"亮色\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"note\">关时从属参数消失；开关只改变启用状态，不承担展开动作。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / DUOTONE\u003c/span>\u003cstrong id=\"toggleOut\">OFF\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"color\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">07\u003c/span>\u003ch2>颜色＋透明度\u003c/h2>\u003csmall>COLOR\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>染色叠加\u003c/span>\u003cspan>COLOR / ALPHA\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>颜色\u003c/span>\u003cdiv class=\"color-row\">\u003cspan class=\"checker\" id=\"colorSwatch\">\u003cinput id=\"colorValue\" type=\"color\" value=\"#c95a54\" aria-label=\"染色颜色\">\u003c/span>\u003cinput class=\"text-input mono\" id=\"colorHex\" type=\"text\" value=\"#C95A54\" maxlength=\"7\" aria-label=\"十六进制颜色\">\u003cinput class=\"num\" id=\"alphaValue\" type=\"number\" min=\"0\" max=\"100\" value=\"64\" aria-label=\"颜色透明度百分比\">\u003cspan class=\"percent\">%\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"note\">色块直接预览透明方格上的合成结果；色号与透明度同行，不再额外占一行预览。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / COLOR\u003c/span>\u003cstrong id=\"colorOut\">#C95A54 / 64%\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"reference\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">08\u003c/span>\u003ch2>素材／对象引用\u003c/h2>\u003csmall>REFERENCE\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>蒙版来源\u003c/span>\u003cspan>OBJECT\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>引用对象\u003c/span>\u003cdiv class=\"ref-wrap\">\u003cbutton class=\"ref-button\" id=\"refButton\" type=\"button\" aria-expanded=\"false\" aria-controls=\"refMenu\">\u003cspan class=\"ref-thumb\">▤\u003c/span>\u003cspan class=\"ref-name\" id=\"refName\">冬季 · 木屋\u003c/span>\u003cspan>▾\u003c/span>\u003c/button>\u003cdiv class=\"ref-menu\" id=\"refMenu\" hidden>\u003cbutton type=\"button\" data-ref=\"冬季 · 木屋\" data-glyph=\"▤\">\u003cspan class=\"ref-thumb\">▤\u003c/span>冬季 · 木屋\u003c/button>\u003cbutton type=\"button\" data-ref=\"前景松林\" data-glyph=\"♠\">\u003cspan class=\"ref-thumb\">♠\u003c/span>前景松林\u003c/button>\u003cbutton type=\"button\" data-ref=\"玻璃罩组\" data-glyph=\"◯\">\u003cspan class=\"ref-thumb\">◯\u003c/span>玻璃罩组\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"note\">引用显示用户可辨认的名称，不能只露出内部 ID；后续可加缩略图与失联状态。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / TARGET\u003c/span>\u003cstrong id=\"refOut\">冬季 · 木屋\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"text\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">09\u003c/span>\u003ch2>文本\u003c/h2>\u003csmall>TEXT\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>位图文字\u003c/span>\u003cspan>MULTILINE\u003c/span>\u003c/div>\u003cdiv class=\"field\" style=\"align-items:start\">\u003cspan style=\"padding-top:5px\">内容\u003c/span>\u003ctextarea id=\"textValue\" rows=\"3\">下一站，秋天。\u003c/textarea>\u003c/div>\u003cp class=\"note\">短名称保持单行，作品文字允许多行与明确的编辑区域。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / CHARACTERS\u003c/span>\u003cstrong id=\"textOut\">8\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"spatial\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">10\u003c/span>\u003ch2>画布空间编辑\u003c/h2>\u003csmall>SPATIAL\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>旋转中心\u003c/span>\u003cspan>CANVAS TARGET\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>中心\u003c/span>\u003cdiv class=\"spatial-actions\">\u003cbutton class=\"set-center\" id=\"setCenter\" type=\"button\">设置中心\u003c/button>\u003cbutton class=\"reset-center\" id=\"resetCenter\" type=\"button\" aria-label=\"还原到中心\" title=\"还原到中心\">⌖\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"note\">进入设置状态后在正式画布取点；这里仅演示入口和复位状态，不另设坐标框。\u003c/p>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / PIVOT\u003c/span>\u003cstrong id=\"spatialOut\">默认中心\u003c/strong>\u003c/div>\u003c/article>\n\n    \u003carticle class=\"specimen\" id=\"pattern\">\u003cheader class=\"spec-head\">\u003cspan class=\"index\">11\u003c/span>\u003ch2>图样预览编辑\u003c/h2>\u003csmall>PATTERN\u003c/small>\u003c/header>\u003cdiv class=\"group-head\">\u003cspan>纹理叠加\u003c/span>\u003cspan>PREVIEW\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003cspan>图样类型\u003c/span>\u003cselect id=\"patternType\">\u003coption value=\"line\">单线\u003c/option>\u003coption value=\"grid\">网格\u003c/option>\u003coption value=\"dots\">点阵\u003c/option>\u003coption value=\"noise\">屏幕噪点\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"pattern-preview\" id=\"patternPreview\">\u003cspan class=\"pattern-color\">\u003cspan class=\"swatch\" id=\"patternSwatch\" style=\"background:#e5b85b\">\u003cinput id=\"patternColor\" type=\"color\" value=\"#e5b85b\" aria-label=\"图样颜色\">\u003c/span>\u003cspan id=\"patternHex\">#E5B85B\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"field compact\">\u003cspan>格距\u003c/span>\u003cinput class=\"num\" id=\"patternSpacing\" type=\"number\" min=\"4\" max=\"22\" value=\"10\" aria-label=\"图样格距\">\u003c/div>\u003cdiv class=\"field compact pattern-pair\">\u003cspan>起始偏移\u003c/span>\u003cdiv class=\"pair-rail\">\u003cdiv class=\"pair\">\u003clabel>X\u003cinput class=\"num\" id=\"patternOffsetX\" type=\"number\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\">\u003c/label>\u003clabel>Y\u003cinput class=\"num\" id=\"patternOffsetY\" type=\"number\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\">\u003c/label>\u003c/div>\u003cspan class=\"pair-slot\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"data-line\">\u003cspan>OUTPUT / PATTERN\u003c/span>\u003cstrong id=\"patternOut\">单线 · 10 PX\u003c/strong>\u003c/div>\u003c/article>\n  \u003c/main>\n  \u003cfooter>ToSampool / Inspector Control Register \u003cspan class=\"mono\">· 11 INPUT TYPES · 01\u003c/span>\u003c/footer>\n\u003c/div>\n\u003cscript>\n  const $=id=>document.getElementById(id);\n  const clamp=(value,min,max)=>Math.max(min,Math.min(max,Number(value)||0));\n  const bind=(ids,fn)=>ids.forEach(id=>$(id).addEventListener('input',fn));\n  function scalar(){$('scalarOut').textContent=$('scalarValue').value+' PX';}\n  $('scalarValue').oninput=scalar;\n  function range(from){const value=clamp($(from).value,0,100);$('rangeSlider').value=value;$('rangeValue').value=value;$('rangeOut').textContent=value+'%';}\n  bind(['rangeSlider','rangeValue'],event=>range(event.target.id));\n  const updateSliderFill=()=>{$('rangeSlider').style.setProperty('--fill',$('rangeSlider').value+'%');};\n  bind(['rangeSlider','rangeValue'],updateSliderFill);updateSliderFill();\n  let ratio=640/360;\n  function pair(changed){\n    if($('ratioLock').getAttribute('aria-pressed')==='true'&&['pairW','pairH'].includes(changed)){\n      if(changed==='pairW')$('pairH').value=Math.max(1,Math.round(Number($('pairW').value||1)/ratio));\n      else $('pairW').value=Math.max(1,Math.round(Number($('pairH').value||1)*ratio));\n    }\n    $('pairOut').textContent=($('pairX').value||0)+', '+($('pairY').value||0)+' · '+($('pairW').value||0)+'×'+($('pairH').value||0);\n  }\n  bind(['pairX','pairY','pairW','pairH'],event=>pair(event.target.id));\n  $('ratioLock').onclick=()=>{const on=$('ratioLock').getAttribute('aria-pressed')!=='true';$('ratioLock').setAttribute('aria-pressed',String(on));$('ratioLock').setAttribute('aria-label',on?'解除宽高比例锁定':'锁定宽高比例');if(on)ratio=Math.max(1,Number($('pairW').value||1))/Math.max(1,Number($('pairH').value||1));};\n  function angle(value){value=Math.round(clamp(value,-180,180));$('angleValue').value=value;$('angleDial').style.setProperty('--angle',value+'deg');$('angleDial').setAttribute('aria-valuenow',value);$('angleOut').textContent=value+'°';}\n  $('angleValue').oninput=()=>angle($('angleValue').value);angle($('angleValue').value);\n  function angleAt(event){const rect=$('angleDial').getBoundingClientRect(),dx=event.clientX-(rect.left+rect.width/2),dy=event.clientY-(rect.top+rect.height/2);angle(Math.atan2(dx,-dy)*180/Math.PI);}\n  $('angleDial').onpointerdown=event=>{if(event.button!==0)return;$('angleDial').setPointerCapture(event.pointerId);angleAt(event);};\n  $('angleDial').onpointermove=event=>{if($('angleDial').hasPointerCapture(event.pointerId))angleAt(event);};\n  $('angleDial').onkeydown=event=>{if(event.key==='ArrowRight'||event.key==='ArrowUp'){event.preventDefault();angle(Number($('angleValue').value)+1);}if(event.key==='ArrowLeft'||event.key==='ArrowDown'){event.preventDefault();angle(Number($('angleValue').value)-1);}};\n  let direction='扫描擦除';function choice(){ $('choiceOut').textContent=direction+' · '+$('choiceSelect').value; }\n  document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{direction=button.dataset.choice;document.querySelectorAll('[data-choice]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));choice();});$('choiceSelect').onchange=choice;\n  $('duotoneSwitch').onclick=()=>{const on=$('duotoneSwitch').getAttribute('aria-checked')!=='true';$('duotoneSwitch').setAttribute('aria-checked',String(on));$('duotoneFields').hidden=!on;$('toggleOut').textContent=on?'ON':'OFF';};\n  document.querySelectorAll('#duotoneFields input').forEach(input=>input.oninput=()=>{input.parentElement.style.background=input.value;});\n  function color(){const hex=/^#[0-9a-f]{6}$/i.test($('colorHex').value)?$('colorHex').value.toUpperCase():$('colorValue').value.toUpperCase(),alpha=clamp($('alphaValue').value,0,100);$('colorValue').value=hex;$('colorHex').value=hex;$('alphaValue').value=alpha;$('colorSwatch').style.setProperty('--preview-color',hex);$('colorSwatch').style.setProperty('--preview-alpha',alpha/100);$('colorOut').textContent=hex+' / '+alpha+'%';}\n  $('colorValue').oninput=()=>{$('colorHex').value=$('colorValue').value;color();};$('colorHex').onchange=color;$('alphaValue').oninput=color;color();\n  $('refButton').onclick=()=>{const open=$('refMenu').hidden;$('refMenu').hidden=!open;$('refButton').setAttribute('aria-expanded',String(open));};\n  document.querySelectorAll('[data-ref]').forEach(button=>button.onclick=()=>{$('refName').textContent=button.dataset.ref;$('refOut').textContent=button.dataset.ref;$('refButton').querySelector('.ref-thumb').textContent=button.dataset.glyph;$('refMenu').hidden=true;$('refButton').setAttribute('aria-expanded','false');});\n  document.addEventListener('click',event=>{if(!event.target.closest('.ref-wrap')){$('refMenu').hidden=true;$('refButton').setAttribute('aria-expanded','false');}});\n  $('textValue').oninput=()=>{$('textOut').textContent=Array.from($('textValue').value).length;};$('textValue').dispatchEvent(new Event('input'));\n  $('setCenter').onclick=()=>{$('setCenter').textContent='点击画布取点…';$('spatialOut').textContent='等待画布取点';};\n  $('resetCenter').onclick=()=>{$('setCenter').textContent='设置中心';$('spatialOut').textContent='默认中心';};\n  function pattern(){const gap=clamp($('patternSpacing').value,4,22),type=$('patternType').value,preview=$('patternPreview'),hex=$('patternColor').value,ox=clamp($('patternOffsetX').value,0,1),oy=clamp($('patternOffsetY').value,0,1);$('patternSpacing').value=gap;preview.style.setProperty('--pattern-color',hex);preview.style.backgroundPosition=`${Math.round(ox*gap)}px ${Math.round(oy*gap)}px`;const style={line:`repeating-linear-gradient(0deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px)`,grid:`repeating-linear-gradient(0deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px),repeating-linear-gradient(90deg,transparent 0 ${gap-2}px,${hex} ${gap-2}px ${gap}px)`,dots:`radial-gradient(circle,${hex} 35%,transparent 40%)`,noise:`radial-gradient(circle,${hex} 20%,transparent 28%),radial-gradient(circle,#80cec3 12%,transparent 20%)`}[type];preview.style.backgroundImage=style;preview.style.backgroundSize=type==='dots'||type==='noise'?`${gap}px ${gap}px`:'auto';$('patternSwatch').style.background=hex;$('patternHex').textContent=hex.toUpperCase();$('patternOut').textContent=$('patternType').selectedOptions[0].text+' · '+gap+' PX';}\n  $('patternType').onchange=pattern;bind(['patternSpacing','patternOffsetX','patternOffsetY','patternColor'],pattern);pattern();\n  document.querySelectorAll('input.num').forEach(input=>{\n    input.addEventListener('pointerdown',event=>{\n      if(event.button!==0||event.ctrlKey||event.metaKey||event.altKey)return;\n      const startY=event.clientY,startValue=Number(input.value)||0,step=Number(input.step)>0?Number(input.step):1,min=input.min===''?-Infinity:Number(input.min),max=input.max===''?Infinity:Number(input.max),precision=(String(step).split('.')[1]||'').length;\n      let dragging=false;\n      const move=next=>{\n        const pixels=startY-next.clientY;\n        if(!dragging&&Math.abs(pixels)\u003c4)return;\n        if(!dragging){dragging=true;input.blur();document.body.style.userSelect='none';}\n        const nextValue=Math.max(min,Math.min(max,startValue+Math.trunc(pixels/5)*step));\n        input.value=nextValue.toFixed(Math.min(precision,3));input.dispatchEvent(new Event('input',{bubbles:true}));\n        next.preventDefault();\n      };\n      const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);document.body.style.userSelect='';};\n      window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',end,{once:true});\n    });\n  });\n\u003c/script>\n\u003cscript>// Shared component contract for the baseline and three visual directions.\n// Keep stored demo values numeric; percent signs are presentation only.\n(() => {\n  const $ = id => document.getElementById(id);\n  const stages = {\n    scalar:'compose', range:'sample', pair:'compose', angle:'sample',\n    choice:'sample', toggle:'sample', color:'decor', reference:'compose',\n    text:'compose', spatial:'compose', pattern:'decor'\n  };\n  Object.entries(stages).forEach(([id, stage]) => $(id)?.setAttribute('data-stage', stage));\n\n  document.querySelectorAll('.unit-input em').forEach(unit => {\n    if (unit.textContent.trim().toLowerCase() === 'px') unit.remove();\n  });\n  function percentField(input) {\n    if (!input || input.parentElement.classList.contains('percent-input')) return;\n    const wrap = document.createElement('span');\n    wrap.className = 'percent-input';\n    input.parentNode.insertBefore(wrap, input);\n    wrap.append(input);\n    const sign = document.createElement('span');\n    sign.className = 'percent-sign';\n    sign.textContent = '%';\n    sign.setAttribute('aria-hidden', 'true');\n    wrap.append(sign);\n  }\n  percentField($('rangeValue'));\n  percentField($('alphaValue'));\n  $('color')?.querySelector('.percent')?.remove();\n\n  const slider = $('rangeSlider');\n  const rangeLine = slider?.closest('.range-line');\n  if (rangeLine) {\n    const control = document.createElement('div');\n    control.className = 'range-control';\n    rangeLine.parentNode.insertBefore(control, rangeLine);\n    control.append(rangeLine);\n    const ends = document.createElement('div');\n    ends.className = 'range-ends';\n    ends.innerHTML = `\u003cspan>${slider.min || '0'}\u003c/span>\u003cspan>${slider.max || '100'}\u003c/span>`;\n    control.prepend(ends);\n  }\n\n  const dial = $('angleDial');\n  if (dial) {\n    const ring = document.createElement('span');\n    ring.className = 'dial-ring';\n    dial.parentNode.insertBefore(ring, dial);\n    ring.append(dial);\n    for (let n = 0; n \u003c 8; n++) {\n      const tick = document.createElement('i');\n      tick.className = 'dial-tick';\n      tick.style.setProperty('--tick-angle', `${n * 45}deg`);\n      tick.setAttribute('aria-hidden', 'true');\n      ring.append(tick);\n    }\n  }\n\n  document.querySelectorAll('.specimen select').forEach(select => {\n    const shell = document.createElement('span');\n    shell.className = 'select-shell';\n    select.parentNode.insertBefore(shell, select);\n    shell.append(select);\n    const arrow = document.createElement('span');\n    arrow.className = 'select-arrow';\n    arrow.textContent = '>';\n    arrow.setAttribute('aria-hidden', 'true');\n    shell.prepend(arrow);\n    const open = () => { shell.classList.add('open'); arrow.textContent = '⌄'; };\n    const close = () => { shell.classList.remove('open'); arrow.textContent = '>'; };\n    select.addEventListener('pointerdown', open);\n    select.addEventListener('keydown', event => { if (['Enter',' ','ArrowDown'].includes(event.key)) open(); });\n    select.addEventListener('change', close);\n    select.addEventListener('blur', close);\n  });\n\n  const switchRow = $('duotoneSwitch')?.closest('.toggle-row');\n  if (switchRow) {\n    const note = $('toggle')?.querySelector('.note');\n    if (note) note.textContent = '打开后显示从属参数；浮标留下向下箭头，提示当前参数已展开。';\n    const name = switchRow.querySelector('span');\n    name.classList.add('toggle-name');\n    switchRow.prepend($('duotoneSwitch'));\n    $('duotoneSwitch').addEventListener('click', () => {\n      switchRow.classList.toggle('enabled', $('duotoneSwitch').getAttribute('aria-checked') === 'true');\n    });\n  }\n\n  const textField = $('textValue')?.closest('.field');\n  textField?.classList.add('field-vertical');\n\n  const preview = $('patternPreview');\n  const patternTypeField = $('patternType')?.closest('.field');\n  const patternColor = preview?.querySelector('.pattern-color');\n  if (preview && patternTypeField && patternColor) {\n    const controls = document.createElement('div');\n    controls.className = 'pattern-controls';\n    preview.after(controls);\n    controls.append(patternTypeField);\n    const colorField = document.createElement('div');\n    colorField.className = 'field pattern-color-field';\n    colorField.innerHTML = '\u003cspan>颜色\u003c/span>';\n    colorField.append(patternColor);\n    controls.append(colorField);\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "inspector-input-print-a.html", "baseline": false, "interactive": true}, {"id": "overprint-poster", "name": "B · 套印海报", "concept": "把采样、拼贴与三色套印推向前台，形成强烈但可读的操作海报。", "typography": "粗重中文标题和数字；珊瑚、赭黄、青绿承担分区标题。", "palette": ["#131d20", "#e96e5d", "#eabe60", "#83d3c9"], "traits": ["三色标题轮替", "重边框与数字模块", "局部网点"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>ToSampool · 输入组件 B / 套印海报\u003c/title>\n  \u003cstyle>\n    :root{\n      color-scheme:dark;\n      --shell:#cdbb98;--shell-hi:#eee0bf;--shell-edge:#67543a;\n      --screen:#0d1418;--screen-soft:#172125;--screen-line:#536168;\n      --ink:#eee9db;--muted:#aab8b9;--cyan:#84d7ce;--cyan-dark:#315a59;\n      --red:#db746c;--yellow:#e9b451;--blue:#80b8da;\n      --focus:#fff2a9;--gap:16px;\n      --type-body:14px;--type-control:13px;--type-caption:11px;--type-section:14px;--typ n    /* B: 套印海报。大字、重色块与局部网点，控制本身保持清晰。 */\n    :root{--screen:#171e22;--screen-soft:#253339;--screen-line:#667477;--ink:#fff1d8;--muted:#b7c3bd;--cyan:#72d5cb;--red:#ea6b61;--yellow:#edbc5c;--blue:#79a9ca;--focus:#f8d47a;--gap:18px}\n    body{background:#212a2b}.shell{background:#252c2c;padding:18px 22px 40px}\n    .mast{border:3px solid #111d20;border-radius:0;background:linear-gradient(100deg,#eb715e 0 54%,#ecbd5c 54% 100%);box-shadow:7px 7px 0 #0c1517;color:#12242a;min-height:91px}\n    .brand{font-size:24px;letter-spacing:-.025em}.brand i{width:19px;height:19px;transform:rotate(-12deg)}\n    .mast-title{font-size:17px;border-color:#283b3d}.mast-meta{font-size:12px}.lamp{background:#142b31;box-shadow:none}\n    .intro{position:relative;padding:25px 3px 21px;border-bottom:4px solid #eb705f;margin-bottom:18px}\n    .intro::after{content:\"\";position:absolute;right:0;bottom:-4px;width:34%;height:4px;background:#75cfc7}\n    h1{font:800 34px \"Microsoft YaHei UI\",sans-serif;letter-spacing:-.035em}.intro p{color:#d8d7c7}.legend{color:#d4d9ce}\n    .specimen{border:2px solid #b6c1b9;background:#131d20;box-shadow:6px 6px 0 #0d1416;overflow:hidden}\n    .specimen::before{content:\"\";position:absolute;right:-19px;top:35px;width:79px;height:79px;opacity:.12;pointer-events:none;background:radial-gradient(circle,#e8b851 40%,transparent 45%) 0 0/9px 9px;transform:rotate(12deg)}\n    .specimen::after{width:100%;height:5px;right:0;bottom:0;background:linear-gradient(90deg,#e97160 0 33%,#e9b954 33% 66%,#7ed4c9 66%)}\n    .spec-head{height:49px;background:#e96e5d;color:#17272b;border:0;margin-bottom:13px}\n    .specimen:nth-child(3n+2) .spec-head{background:#eabe60}.specimen:nth-child(3n) .spec-head{background:#83d3c9}\n    .spec-head .index{font:800 19px Consolas,monospace;color:#17272b;letter-spacing:-.07em}\n    .spec-head h2{font-size:17px;font-weight:800}.spec-head small{color:#334447;font-size:11px;font-weight:700}\n    .group-head{color:#e9bb5d;font-size:14px;border-bott
