[package]
name = "patcharium"
version = "3.0.0"
license = "MIT"
description = "Patcharium desktop host"
authors = ["Mio-Youki"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "patcharium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
